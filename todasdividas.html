<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Lima Painel — Todas as Dívidas</title>
<link rel="icon" href="logo-agrolima.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<script src="supabase-config.js"></script>
<script src="layout.js"></script>
<script>
renderTopbarSidebar('todasdividas');

document.getElementById('mainContent').innerHTML = `
  <div class="pagehead">
    <div>
      <div class="pagetitle">Todas as Dívidas</div>
      <div class="pagesub">Parcelas de financiamento de todas as empresas, por ordem de vencimento</div>
    </div>
    <select id="filtroStatus">
      <option value="pendentes">Só pendentes</option>
      <option value="todas">Todas (inclui pagas)</option>
    </select>
  </div>

  <div class="metrics" id="metricas"><div class="metric"><span class="spinner"></span></div></div>

  <div class="card">
    <div class="cardb table-wrap">
      <table>
        <thead><tr><th>Vencimento</th><th>Empresa</th><th>Banco</th><th>Descrição</th><th style="text-align:right">#</th><th style="text-align:right">Valor</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbodyParcelas"><tr class="empty-row"><td colspan="8"><span class="spinner"></span></td></tr></tbody>
      </table>
    </div>
  </div>
`;

function hojeISO() { return new Date().toISOString().slice(0, 10); }
function hojeBR() { return isoParaBR(hojeISO()); }
function isoParaBR(iso) { const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; }
function brParaIso(br) {
  const m = br.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const [, d, mes, a] = m;
  const dia = Number(d), mesNum = Number(mes), ano = Number(a);
  if (mesNum < 1 || mesNum > 12 || dia < 1 || dia > 31) return null;
  return `${ano}-${String(mesNum).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}

let EMPRESAS = [], FINANCIAMENTOS = [];

async function carregarBase() {
  await checkAuth();
  showUserEmail();

  const [{ data: empresas }, { data: financiamentos }] = await Promise.all([
    supabaseClient.from('empresas').select('id, nome').order('nome'),
    supabaseClient.from('financiamentos').select('*'),
  ]);
  EMPRESAS = empresas || [];
  FINANCIAMENTOS = financiamentos || [];

  carregarLista();
}
document.getElementById('filtroStatus').addEventListener('change', carregarLista);

function nomeEmpresa(id) { return (EMPRESAS.find(e => e.id === id) || {}).nome || '—'; }
function financiamentoPorId(id) { return FINANCIAMENTOS.find(f => f.id === id); }

async function carregarLista() {
  const soPendentes = document.getElementById('filtroStatus').value === 'pendentes';
  const parcelas = await buscarPaginado(() => supabaseClient.from('financiamento_parcelas').select('*').order('vencimento'));
  window._parcelas = parcelas;

  const hoje = hojeISO();
  const lista = (soPendentes ? parcelas.filter(p => !p.pago) : parcelas).slice().sort((a, b) => a.vencimento.localeCompare(b.vencimento));

  const pendentes = parcelas.filter(p => !p.pago);
  const atrasadas = pendentes.filter(p => p.vencimento < hoje);
  const totalPendente = pendentes.reduce((s, p) => s + Number(p.valor), 0);
  const totalAtrasado = atrasadas.reduce((s, p) => s + Number(p.valor), 0);

  document.getElementById('metricas').innerHTML = `
    <div class="metric"><div class="micon bg-warning"><i class="ti ti-calendar-due"></i></div><div><div class="mlabel">Saldo devedor total</div><div class="mval">${formatarMoeda(totalPendente)}</div></div></div>
    <div class="metric"><div class="micon bg-danger"><i class="ti ti-alert-triangle"></i></div><div><div class="mlabel">Vencido e não pago</div><div class="mval">${formatarMoeda(totalAtrasado)}</div></div></div>
    <div class="metric"><div class="micon bg-info"><i class="ti ti-list"></i></div><div><div class="mlabel">Parcelas pendentes</div><div class="mval">${pendentes.length}</div></div></div>
  `;

  document.getElementById('tbodyParcelas').innerHTML = lista.length === 0
    ? '<tr class="empty-row"><td colspan="8">Nenhuma parcela encontrada.</td></tr>'
    : lista.map(p => {
      const f = financiamentoPorId(p.financiamento_id);
      const atrasada = !p.pago && p.vencimento < hoje;
      return `
        <tr>
          <td style="color:${atrasada ? 'var(--danger)' : 'var(--text)'};font-weight:${atrasada ? '600' : '400'}">${new Date(p.vencimento + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
          <td>${f ? nomeEmpresa(f.empresa_id) : '—'}</td>
          <td>${f ? f.banco : '—'}</td>
          <td>${f ? (f.descricao || '—') : '—'}</td>
          <td style="text-align:right">${p.numero}</td>
          <td style="text-align:right">${formatarMoeda(p.valor)} <button class="btn btn-secondary" style="padding:2px 6px" title="Alterar valor" onclick="editarValorParcela(${p.id}, ${p.valor})"><i class="ti ti-pencil"></i></button></td>
          <td>${p.pago ? '<span class="badge bg-success">Paga</span>' : atrasada ? '<span class="badge bg-danger">Atrasada</span>' : '<span class="badge bg-warning">Pendente</span>'}</td>
          <td>${!p.pago ? `<button class="btn btn-success" style="padding:4px 10px" onclick="marcarParcelaPaga(${p.id})"><i class="ti ti-check"></i></button>` : ''}</td>
        </tr>
      `;
    }).join('');
}

async function marcarParcelaPaga(id) {
  const digitado = prompt('Data do pagamento (DD/MM/AAAA):', hojeBR());
  if (!digitado) return;
  const data_pagamento = brParaIso(digitado);
  if (!data_pagamento) { alert('Data inválida. Use o formato DD/MM/AAAA, ex: 22/10/2026.'); return; }
  await supabaseClient.from('financiamento_parcelas').update({ pago: true, data_pagamento }).eq('id', id);
  carregarLista();
}

async function editarValorParcela(id, valorAtual) {
  const digitado = prompt('Novo valor da parcela:', valorAtual);
  if (digitado === null) return;
  const novoValor = parseFloat(digitado.replace(',', '.'));
  if (isNaN(novoValor) || novoValor <= 0) { alert('Valor inválido.'); return; }
  if (!confirm(`Alterar o valor dessa parcela de ${formatarMoeda(valorAtual)} para ${formatarMoeda(novoValor)}?`)) return;
  await supabaseClient.from('financiamento_parcelas').update({ valor: novoValor }).eq('id', id);
  carregarLista();
}

carregarBase();
</script>

</body>
</html>
