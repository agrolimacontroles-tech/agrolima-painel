<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Lima Painel</title>
<link rel="icon" href="logo-agrolima.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@keyframes piscar-atencao { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
#cardAtencaoHoje .cardh i { animation: piscar-atencao 1.1s ease-in-out infinite; }
</style>
</head>
<body>

<script src="supabase-config.js"></script>
<script src="layout.js"></script>
<script>
renderTopbarSidebar('painel');

document.getElementById('mainContent').innerHTML = `
  <div class="pagehead">
    <div>
      <div class="pagetitle">Painel</div>
      <div class="pagesub" id="dataAtual"></div>
    </div>
  </div>

  <div id="cardAtencaoHoje" class="card" style="display:none;border-left:4px solid var(--danger);background:var(--danger-bg-strong)">
    <div class="cardh" style="color:var(--danger)"><i class="ti ti-alert-triangle"></i> Atenção hoje <span class="badge bg-danger" id="contadorHoje" style="margin-left:6px"></span></div>
    <div class="cardb" id="listaAtencaoHoje"></div>
  </div>

  <div id="cardAtencao30" class="card" style="display:none;border-left:4px solid var(--warning);margin-top:12px">
    <div class="cardh" style="color:var(--warning)"><i class="ti ti-clock"></i> Atenção — próximos 30 dias <span class="badge bg-warning" id="contador30" style="margin-left:6px"></span></div>
    <div class="cardb" id="listaAtencao30"></div>
  </div>

  <div class="metrics" id="metricasMes" style="margin-top:12px">
    <div class="metric"><span class="spinner"></span></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
    <div class="card">
      <div class="cardh"><i class="ti ti-building-bank"></i> Saldo do mês por empresa</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Empresa</th><th style="text-align:right">Despesas</th><th style="text-align:right">Receitas</th><th style="text-align:right">Saldo</th></tr></thead>
          <tbody id="tbodySaldoEmpresa"><tr class="empty-row"><td colspan="4"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh"><i class="ti ti-calendar-due"></i> Próximos vencimentos (30 dias)</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Vencimento</th><th>Descrição</th><th>Empresa</th><th style="text-align:right">Valor</th></tr></thead>
          <tbody id="tbodyVencimentos"><tr class="empty-row"><td colspan="4"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
`;

document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

async function carregarPainel() {
  await checkAuth();
  showUserEmail();

  const hoje = new Date();
  const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0, 10);
  const fimMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).toISOString().slice(0, 10);
  const em30dias = new Date(hoje.getTime() + 30 * 86400000).toISOString().slice(0, 10);
  const hojeISO = hoje.toISOString().slice(0, 10);

  const [empresas, contas, lancamentosMes, contasPagar, parcelas, maquinas, usosMaquina, manutencoes, topvacasAnimais, topvacasManejos, topvacasAplicacoes] = await Promise.all([
    supabaseClient.from('empresas').select('id, nome').order('nome').then(r => r.data || []),
    supabaseClient.from('contas').select('id, tipo').then(r => r.data || []),
    buscarPaginado(() => supabaseClient.from('lancamentos').select('empresa_id, conta_id, valor_total').gte('data', inicioMes).lte('data', fimMes)),
    supabaseClient.from('contas_a_pagar').select('empresa_id, prestador, valor, vencimento').eq('pago', false).lte('vencimento', em30dias).order('vencimento').then(r => r.data || []),
    supabaseClient.from('financiamento_parcelas').select('vencimento, valor, financiamento_id, financiamentos(empresa_id, banco, descricao)').eq('pago', false).lte('vencimento', em30dias).order('vencimento').then(r => r.data || []),
    supabaseClient.from('maquinas').select('*').then(r => r.data || []),
    buscarPaginado(() => supabaseClient.from('uso_maquina').select('maquina_id, data, horimetro_final').order('data', { ascending: false })),
    buscarPaginado(() => supabaseClient.from('manutencao_maquina').select('maquina_id, data, horimetro_proxima').order('data', { ascending: false })),
    supabaseClient.from('topvacas_animais').select('id, brinco, nome, situacao_reprodutiva, data_ultima_ia').eq('ativo', true).eq('situacao_reprodutiva', 'Prenhe').then(r => r.data || []),
    supabaseClient.from('topvacas_manejos_sanitarios').select('*').eq('ativo', true).then(r => r.data || []),
    buscarPaginado(() => supabaseClient.from('topvacas_aplicacoes_sanitarias').select('manejo_id, data').order('data', { ascending: false })),
  ]);

  montarAtencao({ contasPagar, parcelas, maquinas, usosMaquina, manutencoes, topvacasAnimais, topvacasManejos, topvacasAplicacoes, hoje, em30dias });

  const tipoPorConta = new Map(contas.map(c => [c.id, c.tipo]));

  let totalDespesas = 0, totalReceitas = 0;
  const porEmpresa = new Map();
  empresas.forEach(e => porEmpresa.set(e.id, { nome: e.nome, despesa: 0, receita: 0 }));

  lancamentosMes.forEach(l => {
    const tipo = tipoPorConta.get(l.conta_id);
    const valor = Number(l.valor_total) || 0;
    const registro = porEmpresa.get(l.empresa_id);
    if (!registro) return;
    if (tipo === 'receita') { registro.receita += valor; totalReceitas += valor; }
    else { registro.despesa += valor; totalDespesas += valor; } // despesa + investimento contam como saída
  });

  document.getElementById('metricasMes').innerHTML = `
    <div class="metric"><div class="micon bg-danger"><i class="ti ti-arrow-down"></i></div><div><div class="mlabel">Saídas do mês (todas empresas)</div><div class="mval">${formatarMoeda(totalDespesas)}</div></div></div>
    <div class="metric"><div class="micon bg-success"><i class="ti ti-arrow-up"></i></div><div><div class="mlabel">Entradas do mês (todas empresas)</div><div class="mval">${formatarMoeda(totalReceitas)}</div></div></div>
    <div class="metric"><div class="micon bg-info"><i class="ti ti-scale"></i></div><div><div class="mlabel">Saldo do mês</div><div class="mval">${formatarMoeda(totalReceitas - totalDespesas)}</div></div></div>
    <div class="metric"><div class="micon bg-warning"><i class="ti ti-calendar-due"></i></div><div><div class="mlabel">A vencer em 30 dias</div><div class="mval">${formatarMoeda(contasPagar.reduce((s, c) => s + Number(c.valor), 0) + parcelas.reduce((s, p) => s + Number(p.valor), 0))}</div></div></div>
  `;

  document.getElementById('tbodySaldoEmpresa').innerHTML = [...porEmpresa.values()].map(e => `
    <tr>
      <td>${e.nome}</td>
      <td style="text-align:right">${formatarMoeda(e.despesa)}</td>
      <td style="text-align:right">${formatarMoeda(e.receita)}</td>
      <td style="text-align:right;color:${e.receita - e.despesa >= 0 ? 'var(--success)' : 'var(--danger)'}">${formatarMoeda(e.receita - e.despesa)}</td>
    </tr>
  `).join('');

  const nomeEmpresa = id => (empresas.find(e => e.id === id) || {}).nome || '—';

  const vencimentos = [
    ...contasPagar.map(c => ({ vencimento: c.vencimento, descricao: c.prestador, empresa: nomeEmpresa(c.empresa_id), valor: c.valor })),
    ...parcelas.map(p => ({ vencimento: p.vencimento, descricao: (p.financiamentos ? p.financiamentos.banco + ' — ' + (p.financiamentos.descricao || 'financiamento') : 'Financiamento'), empresa: nomeEmpresa(p.financiamentos ? p.financiamentos.empresa_id : null), valor: p.valor })),
  ].sort((a, b) => a.vencimento.localeCompare(b.vencimento));

  document.getElementById('tbodyVencimentos').innerHTML = vencimentos.length === 0
    ? '<tr class="empty-row"><td colspan="4">Nenhum vencimento nos próximos 30 dias.</td></tr>'
    : vencimentos.map(v => `
      <tr>
        <td>${new Date(v.vencimento + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
        <td>${v.descricao}</td>
        <td>${v.empresa}</td>
        <td style="text-align:right">${formatarMoeda(v.valor)}</td>
      </tr>
    `).join('');
}

function diasEntre(dataISO, hoje) {
  const d = new Date(dataISO + 'T00:00:00');
  return Math.round((d - new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate())) / 86400000);
}

function montarAtencao({ contasPagar, parcelas, maquinas, usosMaquina, manutencoes, topvacasAnimais, topvacasManejos, topvacasAplicacoes, hoje, em30dias }) {
  const hojeItens = [];
  const prox30Itens = [];

  function classificar(dias, item) {
    if (dias <= 0) hojeItens.push(item);
    else if (dias <= 30) prox30Itens.push(item);
  }

  // Contas a pagar
  contasPagar.forEach(c => {
    const dias = diasEntre(c.vencimento, hoje);
    classificar(dias, {
      titulo: c.prestador,
      detalhe: dias < 0 ? `Vencida há ${-dias} dia(s)` : dias === 0 ? 'Vence hoje' : `Vence em ${dias} dia(s)`,
      valor: formatarMoeda(c.valor),
      link: 'contaspagar.html',
    });
  });

  // Parcelas de financiamento
  parcelas.forEach(p => {
    const dias = diasEntre(p.vencimento, hoje);
    const banco = p.financiamentos ? p.financiamentos.banco : 'Financiamento';
    const empresaId = p.financiamentos ? p.financiamentos.empresa_id : null;
    classificar(dias, {
      titulo: `${banco} — ${p.financiamentos && p.financiamentos.descricao ? p.financiamentos.descricao : 'parcela'}`,
      detalhe: dias < 0 ? `Vencida há ${-dias} dia(s)` : dias === 0 ? 'Vence hoje' : `Vence em ${dias} dia(s)`,
      valor: formatarMoeda(p.valor),
      link: `dividas.html?empresa=${empresaId}&financiamento=${p.financiamento_id}`,
    });
  });

  // Manutenção de máquinas (baseado em horímetro, não em data — atrasada entra em "hoje")
  const LIMITE_AVISO_HORAS = 20;
  maquinas.forEach(m => {
    const ultimoUso = usosMaquina.find(u => u.maquina_id === m.id);
    const ultimaManutencao = manutencoes.find(x => x.maquina_id === m.id);
    if (!ultimoUso || !ultimaManutencao || !ultimaManutencao.horimetro_proxima) return;
    const faltam = Number(ultimaManutencao.horimetro_proxima) - Number(ultimoUso.horimetro_final);
    if (faltam <= 0) {
      hojeItens.push({ titulo: m.nome, detalhe: `Manutenção atrasada — passou ${Math.abs(faltam).toFixed(0)}h do previsto`, link: 'maquinas.html' });
    } else if (faltam <= LIMITE_AVISO_HORAS) {
      prox30Itens.push({ titulo: m.nome, detalhe: `Faltam ${faltam.toFixed(0)}h para a próxima manutenção`, link: 'maquinas.html' });
    }
  });

  // Top Vacas — partos previstos (IA + 283 dias) e manejos sanitários atrasados
  const DIAS_GESTACAO = 283;
  topvacasAnimais.forEach(a => {
    if (!a.data_ultima_ia) return;
    const previsao = new Date(a.data_ultima_ia + 'T00:00:00');
    previsao.setDate(previsao.getDate() + DIAS_GESTACAO);
    const dias = diasEntre(previsao.toISOString().slice(0, 10), hoje);
    if (dias > 30) return;
    classificar(dias, {
      titulo: `${a.brinco}${a.nome ? ' — ' + a.nome : ''}`,
      detalhe: dias < 0 ? `Parto previsto atrasado há ${-dias} dia(s)` : dias === 0 ? 'Parto previsto para hoje' : `Parto previsto em ${dias} dia(s)`,
      link: 'topvacas.html?aba=reproducao',
    });
  });
  topvacasManejos.forEach(m => {
    const aplicacoesDoManejo = topvacasAplicacoes.filter(ap => ap.manejo_id === m.id);
    const ultima = aplicacoesDoManejo[0];
    const diasDesde = ultima ? Math.floor((hoje - new Date(ultima.data + 'T00:00:00')) / 86400000) : null;
    if (diasDesde === null || diasDesde > m.frequencia_dias) {
      hojeItens.push({ titulo: `Top Vacas — ${m.nome}`, detalhe: ultima ? `Atrasado ${diasDesde - m.frequencia_dias} dia(s)` : 'Nunca aplicado', link: 'topvacas.html?aba=sanidade' });
    }
  });

  renderBlocoAtencao('cardAtencaoHoje', 'listaAtencaoHoje', 'contadorHoje', hojeItens);
  renderBlocoAtencao('cardAtencao30', 'listaAtencao30', 'contador30', prox30Itens);
}

function renderBlocoAtencao(idCard, idLista, idContador, itens) {
  const card = document.getElementById(idCard);
  if (itens.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  document.getElementById(idContador).textContent = itens.length;
  document.getElementById(idLista).innerHTML = itens.map(it => `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);cursor:pointer" onclick="location.href='${it.link}'">
      <span style="min-width:0"><b>${it.titulo}</b><br><small style="color:var(--text-dim)">${it.detalhe}</small></span>
      ${it.valor ? `<span style="white-space:nowrap;font-weight:600">${it.valor}</span>` : ''}
    </div>
  `).join('');
}

carregarPainel();
</script>

</body>
</html>
