<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGRO LIMA — Máquinas</title>
<link rel="icon" href="logo-agrolima.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
.maquina-bloco { background: var(--bg-panel); border: 0.5px solid var(--border); border-radius: 12px; padding: 16px; flex: 1; min-width: 220px; }
.maquina-bloco-topo { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.maquina-icone { color: var(--accent, #4a9eff); flex-shrink: 0; }
.maquina-nome { font-weight: 600; font-size: 15px; color: var(--text); }
.maquina-tipo { font-size: 11px; color: var(--text-dim); }
.maquina-linha { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; color: var(--text-muted); }
.maquina-linha b { color: var(--text); font-weight: 600; }
.blocos-maquinas { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
.resumo-uso { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--bg-hover, rgba(127,127,127,.08)); border: 0.5px solid var(--border); font-size: 13px; color: var(--text-muted); display: none; gap: 18px; flex-wrap: wrap; }
.resumo-uso b { color: var(--text); }
.cardh-nota { font-size: 11px; font-weight: 400; color: var(--text-dim); margin-left: 8px; }
tfoot td { font-weight: 600; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<script src="supabase-config.js"></script>
<script src="layout.js"></script>
<script>
renderTopbarSidebar('maquinas');

document.getElementById('mainContent').innerHTML = `
  <div class="pagehead">
    <div>
      <div class="pagetitle">Máquinas</div>
      <div class="pagesub">Uso diário, abastecimento, manutenção e faturamento entre empresas</div>
    </div>
  </div>

  <div class="card">
    <div class="cardh"><i class="ti ti-tractor"></i> Cadastrar máquina</div>
    <div class="cardb">
      <div class="frow cols-3">
        <div class="fgroup">
          <label>Nome</label>
          <input type="text" id="fNomeMaquina" placeholder="Ex: Trator A750, Carregadeira">
        </div>
        <div class="fgroup">
          <label>Tipo</label>
          <input type="text" id="fTipoMaquina" placeholder="Trator, Carregadeira...">
        </div>
        <div class="fgroup" style="justify-content:flex-end">
          <button class="btn btn-secondary" id="btnAddMaquina"><i class="ti ti-plus"></i> Adicionar</button>
        </div>
      </div>
      <div id="listaMaquinas" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
  </div>

  <div class="subtoggle">
    <button class="stbtn active" id="btnTabUso" onclick="mostrarAba('uso')">Uso Diário</button>
    <button class="stbtn" id="btnTabAbastecimento" onclick="mostrarAba('abastecimento')">Abastecimento</button>
    <button class="stbtn" id="btnTabManutencao" onclick="mostrarAba('manutencao')">Manutenção</button>
    <button class="stbtn" id="btnTabOperadores" onclick="mostrarAba('operadores')">Operadores</button>
    <button class="stbtn" id="btnTabRelatorio" onclick="mostrarAba('relatorio')">Relatório</button>
  </div>

  <div id="abaUso">
    <div class="card">
      <div class="cardh" id="tituloFormUso"><i class="ti ti-plus"></i> Novo uso</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup">
            <label>Máquina</label>
            <select id="fMaquina"></select>
          </div>
          <div class="fgroup">
            <label>Empresa beneficiada</label>
            <select id="fEmpresa"></select>
          </div>
          <div class="fgroup">
            <label>Data</label>
            <input type="date" id="fData">
          </div>
          <div class="fgroup">
            <label>Operador</label>
            <select id="fOperador"></select>
          </div>
          <div class="fgroup full">
            <label>Serviço</label>
            <input type="text" id="fServico">
          </div>
          <div class="fgroup">
            <label>Horímetro inicial</label>
            <input type="number" id="fHorimetroInicial" step="0.1">
          </div>
          <div class="fgroup">
            <label>Horímetro final</label>
            <input type="number" id="fHorimetroFinal" step="0.1">
          </div>
          <div class="fgroup">
            <label>Valor da hora da máquina (R$)</label>
            <input type="number" id="fValorHora" step="0.01" value="120">
          </div>
          <div class="fgroup">
            <label>Ganho do operador por hora (R$)</label>
            <input type="number" id="fValorHoraOperador" step="0.01" value="10">
          </div>
        </div>
        <div id="resumoUso" class="resumo-uso"></div>
        <div style="margin-top:14px">
          <button class="btn btn-primary" id="btnSalvar"><i class="ti ti-check"></i> Salvar uso</button>
          <button class="btn btn-secondary" id="btnCancelarEdicaoUso" style="display:none" onclick="cancelarEdicaoUso()"><i class="ti ti-x"></i> Cancelar edição</button>
          <span id="msgSalvar" class="msg" style="display:inline-block;margin-left:10px"></span>
        </div>
      </div>
    </div>

    <div class="pagehead" style="margin-top:22px">
      <div class="pagetitle" style="font-size:16px">Faturamento do mês por empresa</div>
      <input type="month" id="filtroMes">
    </div>
    <div class="card">
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Empresa</th><th style="text-align:right">Horas usadas</th><th style="text-align:right">Valor a faturar</th></tr></thead>
          <tbody id="tbodyFaturamento"><tr class="empty-row"><td colspan="3"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh"><i class="ti ti-list"></i> Histórico de uso</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Máquina</th><th>Empresa</th><th>Operador</th><th>Serviço</th><th style="text-align:right">Horas</th><th style="text-align:right">Valor da máquina</th><th style="text-align:right">Ganho do operador</th><th></th></tr></thead>
          <tbody id="tbodyUso"><tr class="empty-row"><td colspan="9"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaAbastecimento" style="display:none">
    <div class="card">
      <div class="cardh"><i class="ti ti-gas-station"></i> Novo abastecimento</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Máquina</label><select id="qaMaquina"></select></div>
          <div class="fgroup"><label>Data</label><input type="date" id="qaData"></div>
          <div class="fgroup"><label>Quantidade (litros)</label><input type="number" id="qaLitros" step="0.1"></div>
          <div class="fgroup"><label>Valor pago (R$)</label><input type="number" id="qaValor" step="0.01"></div>
          <div class="fgroup full"><label>Observação</label><input type="text" id="qaObservacao"></div>
        </div>
        <button class="btn btn-primary" id="btnAddAbastecimento"><i class="ti ti-check"></i> Salvar abastecimento</button>
        <span id="msgAbastecimento" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>
    <div class="card">
      <div class="cardh"><i class="ti ti-list"></i> Histórico de abastecimento</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Máquina</th><th style="text-align:right">Litros</th><th style="text-align:right">Valor</th><th></th></tr></thead>
          <tbody id="tbodyAbastecimento"><tr class="empty-row"><td colspan="5"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaManutencao" style="display:none">
    <div class="card">
      <div class="cardh"><i class="ti ti-tool"></i> Nova manutenção</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Máquina</label><select id="qmMaquina"></select></div>
          <div class="fgroup"><label>Data da manutenção</label><input type="date" id="qmData"></div>
          <div class="fgroup"><label>Horímetro na hora da manutenção</label><input type="number" id="qmHorimetro" step="0.1"></div>
          <div class="fgroup full"><label>Serviço realizado</label><input type="text" id="qmServico"></div>
          <div class="fgroup"><label>Prazo (horas)</label><input type="number" id="qmPrazo" step="1" placeholder="Ex: 250"></div>
          <div class="fgroup"><label>Horímetro da próxima manutenção</label><input type="number" id="qmHorimetroProxima" step="0.1"></div>
          <div class="fgroup"><label>Valor da manutenção (R$)</label><input type="number" id="qmValor" step="0.01"></div>
        </div>
        <button class="btn btn-primary" id="btnAddManutencao"><i class="ti ti-check"></i> Salvar manutenção</button>
        <span id="msgManutencao" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>
    <div class="card">
      <div class="cardh"><i class="ti ti-list"></i> Histórico de manutenção</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Máquina</th><th>Serviço</th><th style="text-align:right">Horímetro</th><th style="text-align:right">Próxima em</th><th style="text-align:right">Valor</th><th></th></tr></thead>
          <tbody id="tbodyManutencao"><tr class="empty-row"><td colspan="7"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaOperadores" style="display:none">
    <div class="card">
      <div class="cardh"><i class="ti ti-user-cog"></i> Cadastrar operador</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup">
            <label>Nome</label>
            <input type="text" id="opNome" placeholder="Ex: Denis">
          </div>
          <div class="fgroup">
            <label>Ganho por hora trabalhada (R$)</label>
            <input type="number" id="opValorHora" step="0.01" value="10">
          </div>
          <div class="fgroup" style="justify-content:flex-end">
            <button class="btn btn-secondary" id="btnAddOperador"><i class="ti ti-plus"></i> Adicionar</button>
          </div>
        </div>
        <div id="listaOperadores" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div>
        <span id="msgOperador" class="msg" style="display:inline-block"></span>
      </div>
    </div>

    <div class="pagehead">
      <div class="pagetitle" style="font-size:16px">Operadores e lucro das máquinas</div>
      <input type="month" id="filtroMesOperadores">
    </div>

    <div class="metrics" id="metricasOperadores"></div>

    <div class="card">
      <div class="cardh"><i class="ti ti-scale"></i> Lucro das máquinas no mês <span class="cardh-nota">bruto − ganho do operador</span></div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Máquina</th><th style="text-align:right">Horas</th><th style="text-align:right">Valor bruto</th><th style="text-align:right">Despesa (operador)</th><th style="text-align:right">Lucro</th></tr></thead>
          <tbody id="tbodyLucroMaquinas"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh"><i class="ti ti-users"></i> Ganho por operador no mês</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Operador</th><th style="text-align:right">Dias</th><th style="text-align:right">Horas</th><th style="text-align:right">Valor a receber</th></tr></thead>
          <tbody id="tbodyOperadoresMes"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh"><i class="ti ti-chart-bar"></i> Ganho por dia</div>
      <div class="cardb"><canvas id="chartOperadores" height="90"></canvas></div>
    </div>

    <div class="card">
      <div class="cardh"><i class="ti ti-calendar-stats"></i> Dia a dia <span class="cardh-nota">filtro:</span>
        <select id="filtroOperadorDia" style="margin-left:6px"></select>
      </div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Operador</th><th>Máquina</th><th>Empresa</th><th>Serviço</th><th style="text-align:right">Horas</th><th style="text-align:right">Ganho do dia</th></tr></thead>
          <tbody id="tbodyOperadorDia"></tbody>
          <tfoot id="tfootOperadorDia"></tfoot>
        </table>
      </div>
    </div>
  </div>

  <div id="abaRelatorio" style="display:none">
    <div class="pagehead">
      <div class="pagetitle" style="font-size:16px">Relatório por máquina</div>
      <input type="month" id="filtroMesRelatorio">
    </div>

    <div class="metrics" id="metricasRelatorio"></div>

    <div class="blocos-maquinas" id="blocosMaquinas"></div>

    <div class="card">
      <div class="cardh"><i class="ti ti-chart-bar"></i> Receita x Custos por máquina</div>
      <div class="cardb"><canvas id="chartMaquinas" height="90"></canvas></div>
    </div>
  </div>
`;

let EMPRESAS = [];
let MAQUINAS = [];
let OPERADORES = [];
let chartMaquinasInstance = null;
let chartOperadoresInstance = null;

function hojeISO() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function mesAtualISO() { return hojeISO().slice(0, 7); }
function horasDe(u) { return Number(u.horas_trabalhadas ?? (u.horimetro_final - u.horimetro_inicial)) || 0; }
function valorMaquina(u) { return horasDe(u) * Number(u.valor_hora ?? 120); }
function valorOperador(u) { return u.operador_id ? horasDe(u) * Number(u.valor_hora_operador ?? 10) : 0; }
function fimDoMes(mes) { const d = new Date(mes + '-01T00:00:00'); return new Date(d.getFullYear(), d.getMonth() + 1, 0, 12).toISOString().slice(0, 10); }

function mostrarAba(aba) {
  ['uso', 'abastecimento', 'manutencao', 'operadores', 'relatorio'].forEach(a => {
    document.getElementById('aba' + a[0].toUpperCase() + a.slice(1)).style.display = a === aba ? '' : 'none';
    document.getElementById('btnTab' + a[0].toUpperCase() + a.slice(1)).classList.toggle('active', a === aba);
  });
  if (aba === 'relatorio') carregarRelatorio();
  if (aba === 'operadores') carregarOperadores();
}

async function carregarBase() {
  await checkAuth();
  showUserEmail();

  const [{ data: empresas }, { data: maquinas }, { data: operadores }] = await Promise.all([
    supabaseClient.from('empresas').select('id, nome').order('nome'),
    supabaseClient.from('maquinas').select('*').order('nome'),
    supabaseClient.from('operadores').select('*').order('nome'),
  ]);
  EMPRESAS = empresas || [];
  MAQUINAS = maquinas || [];
  OPERADORES = operadores || [];

  document.getElementById('fEmpresa').innerHTML = EMPRESAS.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
  document.getElementById('fData').value = hojeISO();
  document.getElementById('filtroMes').value = mesAtualISO();
  document.getElementById('qaData').value = hojeISO();
  document.getElementById('qmData').value = hojeISO();
  document.getElementById('filtroMesRelatorio').value = mesAtualISO();
  document.getElementById('filtroMesOperadores').value = mesAtualISO();

  renderMaquinas();
  renderOperadores();
  carregarUso();
  carregarAbastecimento();
  carregarManutencao();
}

function renderMaquinas() {
  const opcoes = MAQUINAS.map(m => `<option value="${m.id}">${m.nome}</option>`).join('') || '<option value="">Cadastre uma máquina primeiro</option>';
  document.getElementById('fMaquina').innerHTML = opcoes;
  document.getElementById('qaMaquina').innerHTML = opcoes;
  document.getElementById('qmMaquina').innerHTML = opcoes;
  document.getElementById('listaMaquinas').innerHTML = MAQUINAS.map(m => `<span class="badge bg-info">${m.nome}${m.tipo ? ' — ' + m.tipo : ''}</span>`).join('');
}

document.getElementById('btnAddMaquina').addEventListener('click', async () => {
  const nome = document.getElementById('fNomeMaquina').value.trim();
  const tipo = document.getElementById('fTipoMaquina').value.trim() || null;
  if (!nome) return;
  await supabaseClient.from('maquinas').insert({ nome, tipo });
  document.getElementById('fNomeMaquina').value = '';
  document.getElementById('fTipoMaquina').value = '';
  const { data } = await supabaseClient.from('maquinas').select('*').order('nome');
  MAQUINAS = data || [];
  renderMaquinas();
});

// ---------- Operadores (cadastro) ----------
function renderOperadores() {
  const atual = document.getElementById('fOperador').value;
  document.getElementById('fOperador').innerHTML = OPERADORES.filter(o => o.ativo || String(o.id) === atual)
    .map(o => `<option value="${o.id}">${o.nome}</option>`).join('') || '<option value="">Cadastre um operador na aba Operadores</option>';
  if (atual) document.getElementById('fOperador').value = atual;
  document.getElementById('listaOperadores').innerHTML = OPERADORES.map(o =>
    `<span class="badge ${o.ativo ? 'bg-info' : 'bg-warning'}" title="Clique para ${o.ativo ? 'desativar' : 'reativar'}" style="cursor:pointer" onclick="alternarOperador(${o.id})">${o.nome} — ${formatarMoeda(o.valor_hora)}/h${o.ativo ? '' : ' (inativo)'}</span>`
  ).join('') || '<span style="color:var(--text-dim);font-size:13px">Nenhum operador cadastrado.</span>';
  document.getElementById('filtroOperadorDia').innerHTML = '<option value="">Todos</option>' + OPERADORES.map(o => `<option value="${o.id}">${o.nome}</option>`).join('');
  if (!EDITANDO_USO) preencherValorOperador();
}

function preencherValorOperador() {
  const op = OPERADORES.find(o => String(o.id) === document.getElementById('fOperador').value);
  document.getElementById('fValorHoraOperador').value = op ? op.valor_hora : 10;
  atualizarResumoUso();
}

async function alternarOperador(id) {
  const op = OPERADORES.find(o => o.id === id);
  if (!op) return;
  await supabaseClient.from('operadores').update({ ativo: !op.ativo }).eq('id', id);
  const { data } = await supabaseClient.from('operadores').select('*').order('nome');
  OPERADORES = data || [];
  renderOperadores();
}

document.getElementById('btnAddOperador').addEventListener('click', async () => {
  const nome = document.getElementById('opNome').value.trim();
  const valor_hora = parseFloat(document.getElementById('opValorHora').value);
  const msg = document.getElementById('msgOperador');
  if (!nome || isNaN(valor_hora)) { msg.textContent = 'Informe o nome e o valor por hora.'; msg.className = 'msg show error'; return; }
  const { error } = await supabaseClient.from('operadores').insert({ nome, valor_hora });
  if (error) { msg.textContent = error.code === '23505' ? 'Já existe um operador com esse nome.' : 'Erro: ' + error.message; msg.className = 'msg show error'; return; }
  msg.textContent = 'Operador cadastrado!'; msg.className = 'msg show success';
  document.getElementById('opNome').value = '';
  const { data } = await supabaseClient.from('operadores').select('*').order('nome');
  OPERADORES = data || [];
  renderOperadores();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
});

document.getElementById('fOperador').addEventListener('change', preencherValorOperador);
['fHorimetroInicial', 'fHorimetroFinal', 'fValorHora', 'fValorHoraOperador'].forEach(id => document.getElementById(id).addEventListener('input', atualizarResumoUso));

function atualizarResumoUso() {
  const box = document.getElementById('resumoUso');
  const ini = parseFloat(document.getElementById('fHorimetroInicial').value);
  const fim = parseFloat(document.getElementById('fHorimetroFinal').value);
  if (isNaN(ini) || isNaN(fim) || fim < ini) { box.style.display = 'none'; return; }
  const horas = fim - ini;
  const vm = horas * (parseFloat(document.getElementById('fValorHora').value) || 0);
  const vo = horas * (parseFloat(document.getElementById('fValorHoraOperador').value) || 0);
  box.style.display = 'flex';
  box.innerHTML = `<span>Horas: <b>${horas.toFixed(1)} h</b></span><span>Máquina recebe: <b>${formatarMoeda(vm)}</b></span><span>Operador ganha: <b>${formatarMoeda(vo)}</b></span><span>Sobra para a máquina: <b>${formatarMoeda(vm - vo)}</b></span>`;
}

function nomeOperador(id) { return (OPERADORES.find(o => o.id === id) || {}).nome || '—'; }
function nomeEmpresa(id) { return (EMPRESAS.find(e => e.id === id) || {}).nome || '—'; }
function nomeMaquina(id) { return (MAQUINAS.find(m => m.id === id) || {}).nome || '—'; }

// ---------- Uso diário ----------
let USOS = {};
let EDITANDO_USO = null;

function limparFormUso() {
  EDITANDO_USO = null;
  ['fServico', 'fHorimetroInicial', 'fHorimetroFinal'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fData').value = hojeISO();
  document.getElementById('fValorHora').value = 120;
  preencherValorOperador();
  document.getElementById('tituloFormUso').innerHTML = '<i class="ti ti-plus"></i> Novo uso';
  document.getElementById('btnSalvar').innerHTML = '<i class="ti ti-check"></i> Salvar uso';
  document.getElementById('btnCancelarEdicaoUso').style.display = 'none';
}

function cancelarEdicaoUso() {
  limparFormUso();
  const msg = document.getElementById('msgSalvar');
  msg.textContent = ''; msg.className = 'msg';
}

function editarUso(id) {
  const u = USOS[id];
  if (!u) return;
  EDITANDO_USO = id;
  document.getElementById('fMaquina').value = u.maquina_id;
  document.getElementById('fEmpresa').value = u.empresa_beneficiada_id;
  document.getElementById('fData').value = u.data;
  if (u.operador_id && !document.querySelector(`#fOperador option[value="${u.operador_id}"]`)) document.getElementById('fOperador').insertAdjacentHTML('beforeend', `<option value="${u.operador_id}">${nomeOperador(u.operador_id)} (inativo)</option>`);
  document.getElementById('fOperador').value = u.operador_id || '';
  document.getElementById('fServico').value = u.servico || '';
  document.getElementById('fHorimetroInicial').value = u.horimetro_inicial;
  document.getElementById('fHorimetroFinal').value = u.horimetro_final;
  document.getElementById('fValorHora').value = u.valor_hora ?? 120;
  document.getElementById('fValorHoraOperador').value = u.valor_hora_operador ?? 10;
  atualizarResumoUso();
  document.getElementById('tituloFormUso').innerHTML = '<i class="ti ti-pencil"></i> Editar uso';
  document.getElementById('btnSalvar').innerHTML = '<i class="ti ti-check"></i> Salvar alterações';
  document.getElementById('btnCancelarEdicaoUso').style.display = '';
  const msg = document.getElementById('msgSalvar');
  msg.textContent = ''; msg.className = 'msg';
  document.getElementById('tituloFormUso').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function salvarUso() {
  const maquina_id = Number(document.getElementById('fMaquina').value);
  const empresa_beneficiada_id = Number(document.getElementById('fEmpresa').value);
  const data = document.getElementById('fData').value;
  const horimetro_inicial = parseFloat(document.getElementById('fHorimetroInicial').value);
  const horimetro_final = parseFloat(document.getElementById('fHorimetroFinal').value);
  const operador_id = Number(document.getElementById('fOperador').value) || null;
  const msg = document.getElementById('msgSalvar');

  if (!maquina_id || !empresa_beneficiada_id || !data || !operador_id || isNaN(horimetro_inicial) || isNaN(horimetro_final)) {
    msg.textContent = 'Preencha máquina, empresa, data, operador e horímetros.';
    msg.className = 'msg show error';
    return;
  }
  if (horimetro_final < horimetro_inicial) {
    msg.textContent = 'Horímetro final não pode ser menor que o inicial.';
    msg.className = 'msg show error';
    return;
  }

  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  const registro = {
    maquina_id, empresa_beneficiada_id, data,
    operador_id,
    responsavel: nomeOperador(operador_id),
    servico: document.getElementById('fServico').value || null,
    horimetro_inicial, horimetro_final,
    valor_hora: parseFloat(document.getElementById('fValorHora').value) || 120,
    valor_hora_operador: (() => { const v = parseFloat(document.getElementById('fValorHoraOperador').value); return isNaN(v) ? 10 : v; })(),
  };
  const editando = EDITANDO_USO !== null;
  const { error } = editando
    ? await supabaseClient.from('uso_maquina').update(registro).eq('id', EDITANDO_USO)
    : await supabaseClient.from('uso_maquina').insert(registro);
  btn.disabled = false;

  if (error) {
    msg.textContent = 'Erro ao salvar: ' + error.message;
    msg.className = 'msg show error';
    return;
  }

  msg.textContent = editando ? 'Uso atualizado!' : 'Uso salvo!';
  msg.className = 'msg show success';
  limparFormUso();
  carregarUso();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
}
document.getElementById('btnSalvar').addEventListener('click', salvarUso);
document.getElementById('filtroMes').addEventListener('change', carregarUso);

async function carregarUso() {
  const mes = document.getElementById('filtroMes').value;
  const inicio = mes + '-01';
  const fimData = new Date(mes + '-01T00:00:00');
  const fim = new Date(fimData.getFullYear(), fimData.getMonth() + 1, 0).toISOString().slice(0, 10);

  const usos = await buscarPaginado(() => supabaseClient.from('uso_maquina').select('*').gte('data', inicio).lte('data', fim).order('data', { ascending: false }));
  USOS = Object.fromEntries(usos.map(u => [u.id, u]));

  const faturamento = new Map();
  EMPRESAS.forEach(e => faturamento.set(e.id, { nome: e.nome, horas: 0, valor: 0 }));
  usos.forEach(u => {
    const registro = faturamento.get(u.empresa_beneficiada_id);
    if (registro) { registro.horas += horasDe(u); registro.valor += valorMaquina(u); }
  });

  document.getElementById('tbodyFaturamento').innerHTML = [...faturamento.values()].filter(f => f.horas > 0).map(f => `
    <tr><td>${f.nome}</td><td style="text-align:right">${f.horas.toFixed(1)} h</td><td style="text-align:right">${formatarMoeda(f.valor)}</td></tr>
  `).join('') || '<tr class="empty-row"><td colspan="3">Nenhum uso registrado nesse mês.</td></tr>';

  document.getElementById('tbodyUso').innerHTML = usos.length === 0
    ? '<tr class="empty-row"><td colspan="9">Nenhum uso registrado nesse mês.</td></tr>'
    : usos.map(u => {
      const horas = horasDe(u);
      return `
        <tr>
          <td>${new Date(u.data + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
          <td>${nomeMaquina(u.maquina_id)}</td>
          <td>${nomeEmpresa(u.empresa_beneficiada_id)}</td>
          <td>${u.operador_id ? nomeOperador(u.operador_id) : '—'}</td>
          <td>${u.servico || '—'}</td>
          <td style="text-align:right">${horas.toFixed(1)}</td>
          <td style="text-align:right">${formatarMoeda(valorMaquina(u))}</td>
          <td style="text-align:right">${u.operador_id ? formatarMoeda(valorOperador(u)) : '—'}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-secondary" style="padding:4px 10px" title="Editar" onclick="editarUso(${u.id})"><i class="ti ti-pencil"></i></button>
            <button class="btn btn-danger" style="padding:4px 10px" title="Excluir" onclick="excluirUso(${u.id})"><i class="ti ti-trash"></i></button>
          </td>
        </tr>
      `;
    }).join('');
}

async function excluirUso(id) {
  if (EDITANDO_USO === id) limparFormUso();
  await supabaseClient.from('uso_maquina').delete().eq('id', id);
  carregarUso();
}

// ---------- Aba Operadores: ganho por dia/mês e lucro das máquinas ----------
let USOS_OPERADORES = [];
document.getElementById('filtroMesOperadores').addEventListener('change', carregarOperadores);
document.getElementById('filtroOperadorDia').addEventListener('change', desenharOperadorDia);

async function carregarOperadores() {
  const mes = document.getElementById('filtroMesOperadores').value || mesAtualISO();
  USOS_OPERADORES = await buscarPaginado(() => supabaseClient.from('uso_maquina').select('*').gte('data', mes + '-01').lte('data', fimDoMes(mes)).order('data', { ascending: true }));

  const totHoras = USOS_OPERADORES.reduce((s, u) => s + horasDe(u), 0);
  const bruto = USOS_OPERADORES.reduce((s, u) => s + valorMaquina(u), 0);
  const despesa = USOS_OPERADORES.reduce((s, u) => s + valorOperador(u), 0);
  document.getElementById('metricasOperadores').innerHTML = `
    <div class="metric"><div class="micon bg-info"><i class="ti ti-clock"></i></div><div><div class="mlabel">Horas trabalhadas</div><div class="mval">${totHoras.toFixed(1)} h</div></div></div>
    <div class="metric"><div class="micon bg-success"><i class="ti ti-cash"></i></div><div><div class="mlabel">Valor bruto das máquinas</div><div class="mval">${formatarMoeda(bruto)}</div></div></div>
    <div class="metric"><div class="micon bg-danger"><i class="ti ti-user-dollar"></i></div><div><div class="mlabel">Despesa com operadores</div><div class="mval">${formatarMoeda(despesa)}</div></div></div>
    <div class="metric"><div class="micon bg-warning"><i class="ti ti-scale"></i></div><div><div class="mlabel">Lucro (bruto − operadores)</div><div class="mval">${formatarMoeda(bruto - despesa)}</div></div></div>
  `;

  // Lucro por máquina
  const porMaq = new Map();
  USOS_OPERADORES.forEach(u => {
    const r = porMaq.get(u.maquina_id) || { horas: 0, bruto: 0, despesa: 0 };
    r.horas += horasDe(u); r.bruto += valorMaquina(u); r.despesa += valorOperador(u);
    porMaq.set(u.maquina_id, r);
  });
  const linhasMaq = [...porMaq.entries()].sort((a, b) => b[1].bruto - a[1].bruto);
  document.getElementById('tbodyLucroMaquinas').innerHTML = linhasMaq.map(([id, r]) => `
    <tr><td>${nomeMaquina(id)}</td><td style="text-align:right">${r.horas.toFixed(1)} h</td>
    <td style="text-align:right">${formatarMoeda(r.bruto)}</td>
    <td style="text-align:right;color:var(--danger)">− ${formatarMoeda(r.despesa)}</td>
    <td style="text-align:right;color:var(--success);font-weight:600">${formatarMoeda(r.bruto - r.despesa)}</td></tr>
  `).join('') + (linhasMaq.length ? `
    <tr style="font-weight:600;border-top:1px solid var(--border)"><td>Total</td><td style="text-align:right">${totHoras.toFixed(1)} h</td>
    <td style="text-align:right">${formatarMoeda(bruto)}</td><td style="text-align:right;color:var(--danger)">− ${formatarMoeda(despesa)}</td>
    <td style="text-align:right;color:var(--success)">${formatarMoeda(bruto - despesa)}</td></tr>` : '<tr class="empty-row"><td colspan="5">Nenhum uso registrado nesse mês.</td></tr>');

  // Ganho por operador
  const porOp = new Map();
  USOS_OPERADORES.forEach(u => {
    const chave = u.operador_id || 0;
    const r = porOp.get(chave) || { dias: new Set(), horas: 0, valor: 0 };
    r.dias.add(u.data); r.horas += horasDe(u); r.valor += valorOperador(u);
    porOp.set(chave, r);
  });
  const linhasOp = [...porOp.entries()].sort((a, b) => b[1].valor - a[1].valor);
  document.getElementById('tbodyOperadoresMes').innerHTML = linhasOp.map(([id, r]) => `
    <tr><td>${id ? nomeOperador(id) : '<i style="color:var(--text-dim)">Sem operador informado</i>'}</td>
    <td style="text-align:right">${r.dias.size}</td><td style="text-align:right">${r.horas.toFixed(1)} h</td>
    <td style="text-align:right;font-weight:600">${id ? formatarMoeda(r.valor) : '—'}</td></tr>
  `).join('') || '<tr class="empty-row"><td colspan="4">Nenhum uso registrado nesse mês.</td></tr>';

  desenharGraficoOperadores();
  desenharOperadorDia();
}

function desenharGraficoOperadores() {
  const dias = [...new Set(USOS_OPERADORES.map(u => u.data))].sort();
  const ids = [...new Set(USOS_OPERADORES.filter(u => u.operador_id).map(u => u.operador_id))];
  const cores = ['#4dd4a0', '#6ea8ff', '#f0b840', '#c58bff', '#f07070'];
  const corTexto = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
  const corGrid = getComputedStyle(document.documentElement).getPropertyValue('--divider');
  if (chartOperadoresInstance) chartOperadoresInstance.destroy();
  chartOperadoresInstance = new Chart(document.getElementById('chartOperadores'), {
    type: 'bar',
    data: {
      labels: dias.map(d => d.slice(8) + '/' + d.slice(5, 7)),
      datasets: ids.map((id, i) => ({
        label: nomeOperador(id), backgroundColor: cores[i % cores.length],
        data: dias.map(d => USOS_OPERADORES.filter(u => u.data === d && u.operador_id === id).reduce((s, u) => s + valorOperador(u), 0)),
      })),
    },
    options: {
      plugins: { legend: { labels: { color: corTexto } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${formatarMoeda(c.parsed.y)}` } } },
      scales: {
        x: { stacked: true, ticks: { color: corTexto }, grid: { color: corGrid } },
        y: { stacked: true, ticks: { color: corTexto, callback: v => 'R$ ' + v }, grid: { color: corGrid }, beginAtZero: true },
      },
    },
  });
}

function desenharOperadorDia() {
  const filtro = document.getElementById('filtroOperadorDia').value;
  const linhas = USOS_OPERADORES.filter(u => u.operador_id && (!filtro || String(u.operador_id) === filtro)).slice().sort((a, b) => b.data.localeCompare(a.data) || b.id - a.id);
  document.getElementById('tbodyOperadorDia').innerHTML = linhas.map(u => `
    <tr><td>${new Date(u.data + 'T00:00:00').toLocaleDateString('pt-BR')}</td><td>${nomeOperador(u.operador_id)}</td>
    <td>${nomeMaquina(u.maquina_id)}</td><td>${nomeEmpresa(u.empresa_beneficiada_id)}</td><td>${u.servico || '—'}</td>
    <td style="text-align:right">${horasDe(u).toFixed(1)} h</td><td style="text-align:right">${formatarMoeda(valorOperador(u))}</td></tr>
  `).join('') || '<tr class="empty-row"><td colspan="7">Nenhum uso registrado nesse mês.</td></tr>';
  const h = linhas.reduce((s, u) => s + horasDe(u), 0), v = linhas.reduce((s, u) => s + valorOperador(u), 0);
  document.getElementById('tfootOperadorDia').innerHTML = linhas.length ? `<tr><td colspan="5">Total${filtro ? ' — ' + nomeOperador(Number(filtro)) : ''}</td><td style="text-align:right">${h.toFixed(1)} h</td><td style="text-align:right">${formatarMoeda(v)}</td></tr>` : '';
}

async function carregarRelatorio() {
  const mes = document.getElementById('filtroMesRelatorio').value;
  const inicio = mes + '-01';
  const fimData = new Date(mes + '-01T00:00:00');
  const fim = new Date(fimData.getFullYear(), fimData.getMonth() + 1, 0).toISOString().slice(0, 10);

  const [usos, abastecimentos, manutencoes, todasManutencoes, todosUsos] = await Promise.all([    buscarPaginado(() => supabaseClient.from('uso_maquina').select('*').gte('data', inicio).lte('data', fim)),
    buscarPaginado(() => supabaseClient.from('abastecimento_maquina').select('*').gte('data', inicio).lte('data', fim)),
    buscarPaginado(() => supabaseClient.from('manutencao_maquina').select('*').gte('data', inicio).lte('data', fim)),
    buscarPaginado(() => supabaseClient.from('manutencao_maquina').select('*').order('data', { ascending: false })),
    buscarPaginado(() => supabaseClient.from('uso_maquina').select('*').order('data', { ascending: false })),
  ]);

  const porMaquina = new Map();
  MAQUINAS.forEach(m => porMaquina.set(m.id, { nome: m.nome, tipo: m.tipo, horas: 0, receita: 0, operador: 0, combustivel: 0, manutencao: 0 }));

  usos.forEach(u => {
    const reg = porMaquina.get(u.maquina_id);
    if (!reg) return;
    reg.horas += horasDe(u);
    reg.receita += valorMaquina(u);
    reg.operador += valorOperador(u);
  });
  abastecimentos.forEach(a => { const reg = porMaquina.get(a.maquina_id); if (reg) reg.combustivel += Number(a.valor); });
  manutencoes.forEach(m => { const reg = porMaquina.get(m.maquina_id); if (reg) reg.manutencao += Number(m.valor) || 0; });

  const totalCombustivel = [...porMaquina.values()].reduce((s, r) => s + r.combustivel, 0);
  const totalManutencao = [...porMaquina.values()].reduce((s, r) => s + r.manutencao, 0);
  const totalReceita = [...porMaquina.values()].reduce((s, r) => s + r.receita, 0);
  const totalOperador = [...porMaquina.values()].reduce((s, r) => s + r.operador, 0);

  document.getElementById('metricasRelatorio').innerHTML = `
    <div class="metric"><div class="micon bg-success"><i class="ti ti-cash"></i></div><div><div class="mlabel">Receita do mês</div><div class="mval">${formatarMoeda(totalReceita)}</div></div></div>
    <div class="metric"><div class="micon bg-info"><i class="ti ti-user-cog"></i></div><div><div class="mlabel">Operadores do mês</div><div class="mval">${formatarMoeda(totalOperador)}</div></div></div>
    <div class="metric"><div class="micon bg-danger"><i class="ti ti-gas-station"></i></div><div><div class="mlabel">Abastecimento do mês</div><div class="mval">${formatarMoeda(totalCombustivel)}</div></div></div>
    <div class="metric"><div class="micon bg-warning"><i class="ti ti-tool"></i></div><div><div class="mlabel">Manutenção do mês</div><div class="mval">${formatarMoeda(totalManutencao)}</div></div></div>
    <div class="metric"><div class="micon bg-info"><i class="ti ti-scale"></i></div><div><div class="mlabel">Saldo do mês</div><div class="mval">${formatarMoeda(totalReceita - totalOperador - totalCombustivel - totalManutencao)}</div></div></div>
  `;

  document.getElementById('blocosMaquinas').innerHTML = MAQUINAS.map(m => {
    const reg = porMaquina.get(m.id);
    const ultimaManutencao = todasManutencoes.find(x => x.maquina_id === m.id);
    const ultimoUso = todosUsos.find(x => x.maquina_id === m.id);
    let avisoManutencao = '';
    if (ultimaManutencao && ultimaManutencao.horimetro_proxima && ultimoUso) {
      const horimetroAtual = Number(ultimoUso.horimetro_final);
      const faltam = Number(ultimaManutencao.horimetro_proxima) - horimetroAtual;
      if (faltam <= 0) avisoManutencao = `<span class="badge bg-danger" style="margin-top:6px;display:inline-block">Manutenção atrasada</span>`;
      else if (faltam <= 20) avisoManutencao = `<span class="badge bg-warning" style="margin-top:6px;display:inline-block">Faltam ${faltam.toFixed(0)}h p/ manutenção</span>`;
    }
    return `
      <div class="maquina-bloco">
        <div class="maquina-bloco-topo">
          <div class="maquina-icone">${iconeMaquinaSvg(m.tipo)}</div>
          <div><div class="maquina-nome">${m.nome}</div><div class="maquina-tipo">${m.tipo || ''}</div></div>
        </div>
        <div class="maquina-linha"><span>Horas trabalhadas</span><b>${reg.horas.toFixed(1)} h</b></div>
        <div class="maquina-linha"><span>Receita</span><b style="color:var(--success)">${formatarMoeda(reg.receita)}</b></div>
        <div class="maquina-linha"><span>Operador</span><b style="color:var(--danger)">${formatarMoeda(reg.operador)}</b></div>
        <div class="maquina-linha"><span>Abastecimento</span><b style="color:var(--danger)">${formatarMoeda(reg.combustivel)}</b></div>
        <div class="maquina-linha"><span>Manutenção</span><b style="color:var(--warning)">${formatarMoeda(reg.manutencao)}</b></div>
        ${avisoManutencao}
      </div>
    `;
  }).join('') || '<p style="color:var(--text-dim);font-size:13px">Nenhuma máquina cadastrada.</p>';

  if (chartMaquinasInstance) chartMaquinasInstance.destroy();
  const nomes = MAQUINAS.map(m => m.nome);
  const corTexto = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
  const corGrid = getComputedStyle(document.documentElement).getPropertyValue('--divider');
  chartMaquinasInstance = new Chart(document.getElementById('chartMaquinas'), {
    type: 'bar',
    data: {
      labels: nomes,
      datasets: [
        { label: 'Receita', backgroundColor: '#4dd4a0', data: MAQUINAS.map(m => porMaquina.get(m.id).receita) },
        { label: 'Operador', backgroundColor: '#6ea8ff', data: MAQUINAS.map(m => porMaquina.get(m.id).operador) },
        { label: 'Abastecimento', backgroundColor: '#f07070', data: MAQUINAS.map(m => porMaquina.get(m.id).combustivel) },
        { label: 'Manutenção', backgroundColor: '#f0b840', data: MAQUINAS.map(m => porMaquina.get(m.id).manutencao) },
      ],
    },
    options: {
      plugins: { legend: { labels: { color: corTexto } } },
      scales: {
        x: { ticks: { color: corTexto }, grid: { color: corGrid } },
        y: { ticks: { color: corTexto }, grid: { color: corGrid }, beginAtZero: true },
      },
    },
  });
}

carregarBase();
</script>

</body>
</html>
