.checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.checklist-item:last-child { border-bottom: none; }
.checklist-item.done .checklist-texto { text-decoration: line-through; color: var(--text-dim); }
.checklist-check { width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; cursor: pointer; accent-color: var(--success); }
.checklist-texto { flex: 1; font-size: 14px; color: var(--text); line-height: 1.4; }
.checklist-nota { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.progress-bar-wrap { background: var(--track-bg); border-radius: 6px; height: 10px; overflow: hidden; margin-top: 6px; }
.progress-bar-fill { height: 100%; background: var(--success); border-radius: 6px; transition: width 0.3s; }
.subgrupo-titulo { font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); margin: 14px 0 4px; }
</style>

function pad2(n) { return String(n).padStart(2, '0'); }

function getPeriodoChave(tipo) {
  const hoje = new Date();
  if (tipo === 'diario') return hoje.toISOString().slice(0, 10);
  if (tipo === 'mensal') return `${hoje.getFullYear()}-${pad2(hoje.getMonth() + 1)}`;
  if (tipo === 'semanal') {
    const d = new Date(Date.UTC(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()));
    const diaSemana = (d.getUTCDay() + 6) % 7; // segunda=0
    d.setUTCDate(d.getUTCDate() - diaSemana + 3);
    const primeiraQuinta = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    const semana = 1 + Math.round(((d - primeiraQuinta) / 86400000 - 3 + ((primeiraQuinta.getUTCDay() + 6) % 7)) / 7);
    return `${d.getUTCFullYear()}-W${pad2(semana)}`;
  }
  return ''; // 'demanda' — não reseta automaticamente
}

let CONCLUIDOS = new Set(); // `${item_id}|${periodo_chave}`

async function carregarConcluidos() {
  const { data } = await supabaseClient.from('checklist_execucoes').select('item_id, periodo_chave');
  CONCLUIDOS = new Set((data || []).map(r => `${r.item_id}|${r.periodo_chave}`));
}

async function alternarItem(itemId, periodoChave, concluidoAtual) {
  if (concluidoAtual) {
    await supabaseClient.from('checklist_execucoes').delete().eq('item_id', itemId).eq('periodo_chave', periodoChave);
    CONCLUIDOS.delete(`${itemId}|${periodoChave}`);
  } else {
    await supabaseClient.from('checklist_execucoes').upsert({ item_id: itemId, periodo_chave: periodoChave });
    CONCLUIDOS.add(`${itemId}|${periodoChave}`);
  }
  renderSecoes();
}

async function resetarSecao(secaoId) {
  if (!confirm('Desmarcar todos os itens dessa seção?')) return;
  const secao = SECOES.find(s => s.id === secaoId);
  const periodoChave = getPeriodoChave(secao.tipoPeriodo);
  for (const item of secao.itens) {
    await supabaseClient.from('checklist_execucoes').delete().eq('item_id', item.id).eq('periodo_chave', periodoChave);
    CONCLUIDOS.delete(`${item.id}|${periodoChave}`);
  }
  renderSecoes();
}

function renderSecoes() {
  document.getElementById('secoes').innerHTML = SECOES.map(secao => {
    const periodoChave = getPeriodoChave(secao.tipoPeriodo);
    const total = secao.itens.length;
    const feitos = secao.itens.filter(it => CONCLUIDOS.has(`${it.id}|${periodoChave}`)).length;
    const pct = total ? Math.round((feitos / total) * 100) : 0;

    let ultimoGrupo = null;
    const itensHtml = secao.itens.map(item => {
      const concluido = CONCLUIDOS.has(`${item.id}|${periodoChave}`);
      let grupoHtml = '';
      if (item.grupo && item.grupo !== ultimoGrupo) {
        grupoHtml = `<div class="subgrupo-titulo">${item.grupo}</div>`;
        ultimoGrupo = item.grupo;
      }
      return `
        ${grupoHtml}
        <div class="checklist-item ${concluido ? 'done' : ''}">
          <input type="checkbox" class="checklist-check" ${concluido ? 'checked' : ''} onchange="alternarItem('${item.id}', '${periodoChave}', ${concluido})">
          <div class="checklist-texto">
            ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener">${item.texto} <i class="ti ti-external-link" style="font-size:12px"></i></a>` : item.texto}
            ${item.nota ? `<div class="checklist-nota">${item.nota}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="card">
        <div class="cardh" style="display:flex;justify-content:space-between;align-items:center">
          <span><i class="ti ${secao.icone}"></i> ${secao.titulo}</span>
          <button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="resetarSecao('${secao.id}')" title="Desmarcar tudo"><i class="ti ti-refresh"></i></button>
        </div>
        <div class="cardb">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:2px">
            <span>${feitos} de ${total} concluídos</span><span>${pct}%</span>
          </div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          <div style="margin-top:10px">${itensHtml}</div>
        </div>
      </div>
    `;
  }).join('');
}

(async function init() {
  await carregarConcluidos();
  renderSecoes();
})();
