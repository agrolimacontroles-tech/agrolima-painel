<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Lima Painel — Funcionários</title>
<link rel="icon" href="logo-agrolima.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.grid-dias { font-size: 12px; border-collapse: collapse; }
.grid-dias th, .grid-dias td { padding: 3px 4px; white-space: nowrap; text-align: center; }
.grid-dias thead th { background: #073763; color: #fff; position: sticky; top: 0; }
.grid-dias select { font-size: 11px; padding: 2px 3px; border-radius: 4px; border: 0.5px solid var(--border); background: var(--bg-panel); color: var(--text); font-weight: 500; }
.dia-sabado td:first-child { background: var(--track-bg); font-weight: 600; }
.dia-domingo td:first-child { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
.blocos-funcionarios { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.bloco-funcionario { padding: 7px 16px; border-radius: 999px; border: 0.5px solid var(--border); background: var(--bg-panel); color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s, color 0.15s; }
.bloco-funcionario.selecionado { background: var(--accent-bg); color: #cfe5ff; border-color: transparent; font-weight: 600; }
.obs-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0 2px; vertical-align: middle; }
.obs-btn.tem-obs { color: var(--info); }
.legenda-status { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.legenda-chip { font-size: 11px; padding: 3px 9px; border-radius: 5px; font-weight: 500; }
.dia-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.dia-item:last-child { border-bottom: none; }
.dia-item select { font-size: 12px; padding: 4px 6px; border-radius: 5px; border: 0.5px solid var(--border); background: var(--bg-panel); color: var(--text); font-weight: 500; }
.dia-item input[type="text"] { font-size: 12px; padding: 5px 8px; border-radius: 5px; border: 0.5px solid var(--border); background: var(--bg-panel); color: var(--text); }

.atividade-linha { display: flex; align-items: flex-start; gap: 14px; padding: 12px 10px; border-bottom: 0.5px solid var(--border); }
.atividade-linha:last-child { border-bottom: none; }
.atividade-linha.dia-domingo { background: var(--danger-bg); border-radius: 8px; margin: 2px 0; }
.atividade-linha.dia-sabado { background: var(--track-bg); border-radius: 8px; margin: 2px 0; }
.atividade-dia-label { width: 60px; flex-shrink: 0; font-weight: 600; font-size: 13px; padding-top: 10px; text-align: center; text-transform: capitalize; }
.atividade-linha.dia-domingo .atividade-dia-label { color: var(--danger); }
.atividade-campos { flex: 1; display: flex; gap: 14px; flex-wrap: wrap; }
.atividade-campo { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 5px; }
.atividade-campo label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .4px; }
.atividade-campo input { width: 100%; padding: 9px 11px; font-size: 13px; border-radius: 7px; border: 0.5px solid var(--border); background: var(--bg-panel); color: var(--text); box-sizing: border-box; }
.atividade-campo input:focus { outline: none; border-color: var(--accent-bg); }
</style>
</head>
<body>

<script src="supabase-config.js"></script>
<script src="layout.js"></script>
<script>
renderTopbarSidebar('funcionarios');

document.getElementById('mainContent').innerHTML = `
  <div class="pagehead">
    <div>
      <div class="pagetitle">Funcionários</div>
      <div class="pagesub">Cadastro, dias trabalhados e férias</div>
    </div>
  </div>

  <div class="subtoggle">
    <button class="stbtn active" id="btnTabFuncionarios" onclick="mostrarAba('funcionarios')">Funcionários</button>
    <button class="stbtn" id="btnTabDias" onclick="mostrarAba('dias')">Dias Trabalhados</button>
    <button class="stbtn" id="btnTabAtividades" onclick="mostrarAba('atividades')">Programação Semanal</button>
    <button class="stbtn" id="btnTabFerias" onclick="mostrarAba('ferias')">Férias</button>
  </div>

  <div id="abaFuncionarios">
    <div class="card">
      <div class="cardh"><i class="ti ti-user-plus"></i> Novo funcionário</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Nome</label><input type="text" id="fNome"></div>
          <div class="fgroup"><label>Cargo</label><input type="text" id="fCargo"></div>
          <div class="fgroup"><label>Empresa / Fazenda</label><select id="fEmpresa"></select></div>
          <div class="fgroup"><label>Data de admissão</label><input type="date" id="fDataAdmissao"></div>
          <div class="fgroup"><label>Salário</label><input type="number" id="fSalario" step="0.01"></div>
        </div>
        <button class="btn btn-primary" id="btnAddFuncionario"><i class="ti ti-check"></i> Cadastrar</button>
        <span id="msgFuncionario" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>
    <div class="card">
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Nome</th><th>Cargo</th><th>Empresa</th><th>Admissão</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbodyFuncionarios"><tr class="empty-row"><td colspan="6"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaDias" style="display:none">
    <div class="pagehead">
      <div class="pagetitle" style="font-size:16px">Lançamento do dia</div>
      <input type="date" id="filtroDiaDias">
    </div>
    <div class="card">
      <div class="cardb">
        <div class="legenda-status" id="legendaStatus"></div>
        <div id="listaDiaDias"></div>
      </div>
    </div>

    <button class="btn btn-secondary" id="btnExpandirMes" onclick="alternarGradeMes()" style="margin-bottom:10px">
      <i class="ti ti-chevron-down" id="iconeExpandirMes"></i> Ver grade do mês inteiro
    </button>

    <div id="blocoGradeMes" style="display:none">
      <div class="pagehead">
        <div class="pagetitle" style="font-size:16px">Grade do mês</div>
        <input type="month" id="filtroMesDias">
      </div>
      <div class="card">
        <div class="cardb table-wrap">
          <table class="grid-dias" id="tabelaGridDias"><tbody><tr class="empty-row"><td><span class="spinner"></span></td></tr></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <div id="abaAtividades" style="display:none">
    <div class="pagehead">
      <div class="pagetitle" style="font-size:16px">Programação Semanal</div>
      <input type="month" id="filtroMesAtividades">
    </div>
    <div class="subtoggle" id="tabsSemanas"></div>
    <div class="blocos-funcionarios" id="blocosFuncionariosAtividades"></div>

    <div class="card">
      <div class="cardh"><i class="ti ti-user"></i> <span id="nomeFuncionarioSelecionado"></span></div>
      <div class="cardb" id="listaSemanaAtividades"><span class="spinner"></span></div>
    </div>

    <button class="btn btn-secondary" id="btnExpandirMesAtividades" onclick="alternarGradeMesAtividades()" style="margin-bottom:10px">
      <i class="ti ti-chevron-down" id="iconeExpandirMesAtividades"></i> Ver mês inteiro
    </button>

    <div id="blocoGradeMesAtividades" style="display:none">
      <div class="card">
        <div class="cardh"><i class="ti ti-calendar"></i> Mês inteiro — <span id="nomeFuncionarioSelecionadoMes"></span></div>
        <div class="cardb" id="listaGridAtividades"><span class="spinner"></span></div>
      </div>
    </div>
  </div>

  <div id="abaFerias" style="display:none">
    <div class="card">
      <div class="cardh"><i class="ti ti-plus"></i> Nova férias</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Funcionário</label><select id="fvFuncionario"></select></div>
          <div class="fgroup"><label>Período aquisitivo — início</label><input type="date" id="fvPeriodoInicio"></div>
          <div class="fgroup"><label>Período aquisitivo — fim</label><input type="date" id="fvPeriodoFim"></div>
          <div class="fgroup"><label>Início do gozo</label><input type="date" id="fvGozoInicio"></div>
          <div class="fgroup"><label>Fim do gozo</label><input type="date" id="fvGozoFim"></div>
          <div class="fgroup"><label>Dias</label><input type="number" id="fvDias" step="1" value="30"></div>
        </div>
        <button class="btn btn-primary" id="btnAddFerias"><i class="ti ti-check"></i> Registrar férias</button>
      </div>
    </div>
    <div class="card">
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Funcionário</th><th>Período aquisitivo</th><th>Gozo</th><th style="text-align:right">Dias</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbodyFerias"><tr class="empty-row"><td colspan="6"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
`;

// Cores extraídas da planilha real (SETEMBRO.xlsx, legenda "STATUS E CORES")
const STATUS_CORES = {
  'Trabalhou':         { bg: '#93C47D', fg: '#1a3d0f' },
  'Falta':             { bg: '#EA4335', fg: '#ffffff' },
  'Férias':            { bg: '#E69138', fg: '#3d1f00' },
  'Atestado':          { bg: '#B7E1CD', fg: '#0f3d24' },
  'Licença':           { bg: '#F4CCCC', fg: '#5c1010' },
  'Folga':             { bg: '#4A86E8', fg: '#ffffff' },
  'Folga Concedida':   { bg: '#FFE599', fg: '#4d3b00' },
  'Feriado':           { bg: '#FFFF00', fg: '#3d3d00' },
  'Extra +':           { bg: '#B4A7D6', fg: '#2e1a4d' },
  'Extra Solicitada':  { bg: '#46BDC6', fg: '#00363a' },
  'Dia Incompleto':    { bg: '#C27BA0', fg: '#3d0f26' },
  'Expediente Normal': { bg: '#93C47D', fg: '#1a3d0f' },
};
const STATUS_OPCOES = Object.keys(STATUS_CORES);

function renderLegendaStatus() {
  document.getElementById('legendaStatus').innerHTML = STATUS_OPCOES.map(s =>
    `<span class="legenda-chip" style="background:${STATUS_CORES[s].bg};color:${STATUS_CORES[s].fg}">${s}</span>`
  ).join('');
}

function mostrarAba(aba) {
  ['funcionarios', 'dias', 'atividades', 'ferias'].forEach(a => {
    document.getElementById('aba' + a[0].toUpperCase() + a.slice(1)).style.display = a === aba ? '' : 'none';
    document.getElementById('btnTab' + a[0].toUpperCase() + a.slice(1)).classList.toggle('active', a === aba);
  });
}

let EMPRESAS = [];
let FUNCIONARIOS = [];

function hojeISO() { return new Date().toISOString().slice(0, 10); }
function mesAtualISO() { return new Date().toISOString().slice(0, 7); }

async function carregarBase() {
  await checkAuth();
  showUserEmail();

  const { data: empresas } = await supabaseClient.from('empresas').select('id, nome').order('nome');
  EMPRESAS = empresas || [];
  document.getElementById('fEmpresa').innerHTML = EMPRESAS.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
  document.getElementById('fDataAdmissao').value = hojeISO();
  document.getElementById('filtroDiaDias').value = hojeISO();
  document.getElementById('filtroMesDias').value = mesAtualISO();
  document.getElementById('filtroMesAtividades').value = mesAtualISO();
  renderLegendaStatus();

  await carregarFuncionarios();
  await carregarListaDia();
  semanaSelecionada = semanaDoDiaAtual();
  renderTabsSemanas();
  await carregarSemanaAtividades();
  await carregarFerias();

  const abaUrl = new URLSearchParams(location.search).get('aba');
  if (abaUrl) mostrarAba(abaUrl);
}

function nomeEmpresa(id) { return (EMPRESAS.find(e => e.id === id) || {}).nome || '—'; }

// ---------- Funcionários ----------
document.getElementById('btnAddFuncionario').addEventListener('click', async () => {
  const nome = document.getElementById('fNome').value.trim();
  const data_admissao = document.getElementById('fDataAdmissao').value;
  const msg = document.getElementById('msgFuncionario');
  if (!nome || !data_admissao) {
    msg.textContent = 'Preencha nome e data de admissão.';
    msg.className = 'msg show error';
    return;
  }
  const { error } = await supabaseClient.from('funcionarios').insert({
    nome,
    cargo: document.getElementById('fCargo').value || null,
    empresa_id: Number(document.getElementById('fEmpresa').value) || null,
    data_admissao,
    salario: parseFloat(document.getElementById('fSalario').value) || null,
  });
  if (error) {
    msg.textContent = 'Erro: ' + error.message;
    msg.className = 'msg show error';
    return;
  }
  msg.textContent = 'Funcionário cadastrado!';
  msg.className = 'msg show success';
  ['fNome', 'fCargo', 'fSalario'].forEach(id => document.getElementById(id).value = '');
  await carregarFuncionarios();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
});

function badgeStatusFuncionario(status) {
  const map = { ativo: 'bg-success', ferias: 'bg-info', afastado: 'bg-warning', demitido: 'bg-danger' };
  return `<span class="badge ${map[status] || 'bg-info'}">${status}</span>`;
}

async function carregarFuncionarios() {
  const { data } = await supabaseClient.from('funcionarios').select('*').order('nome');
  FUNCIONARIOS = data || [];
  renderSelectFuncionariosFerias();

  document.getElementById('tbodyFuncionarios').innerHTML = FUNCIONARIOS.length === 0
    ? '<tr class="empty-row"><td colspan="6">Nenhum funcionário cadastrado.</td></tr>'
    : FUNCIONARIOS.map(f => `
      <tr>
        <td>${f.nome}</td>
        <td>${f.cargo || '—'}</td>
        <td>${nomeEmpresa(f.empresa_id)}</td>
        <td>${new Date(f.data_admissao + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
        <td>${badgeStatusFuncionario(f.status)}</td>
        <td style="white-space:nowrap">
          ${f.status !== 'demitido'
            ? `<button class="btn btn-danger" style="padding:4px 10px" onclick="demitirFuncionario(${f.id})"><i class="ti ti-user-x"></i> Demitir</button>`
            : `<button class="btn btn-success" style="padding:4px 10px" onclick="reativarFuncionario(${f.id})"><i class="ti ti-user-check"></i> Reativar</button>`}
          <button class="btn btn-secondary" style="padding:4px 10px" onclick="excluirFuncionario(${f.id})"><i class="ti ti-trash"></i></button>
        </td>
      </tr>
    `).join('');
}

async function demitirFuncionario(id) {
  const motivo = prompt('Motivo da demissão (opcional):') || null;
  const data_demissao = hojeISO();
  await supabaseClient.from('funcionarios').update({ status: 'demitido', data_demissao, motivo_demissao: motivo }).eq('id', id);
  carregarFuncionarios();
}

async function reativarFuncionario(id) {
  await supabaseClient.from('funcionarios').update({ status: 'ativo', data_demissao: null, motivo_demissao: null }).eq('id', id);
  carregarFuncionarios();
}

async function excluirFuncionario(id) {
  if (!confirm('Excluir esse funcionário e todo o histórico dele?')) return;
  await supabaseClient.from('funcionario_dias_trabalhados').delete().eq('funcionario_id', id);
  await supabaseClient.from('funcionario_ferias').delete().eq('funcionario_id', id);
  await supabaseClient.from('funcionarios').delete().eq('id', id);
  carregarFuncionarios();
  carregarListaDia();
  if (document.getElementById('blocoGradeMes').style.display !== 'none') carregarGridDias();
  carregarFerias();
}

// ---------- Dias trabalhados — lançamento rápido do dia ----------
document.getElementById('filtroDiaDias').addEventListener('change', carregarListaDia);

async function carregarListaDia() {
  const data = document.getElementById('filtroDiaDias').value;
  const ativos = FUNCIONARIOS.filter(f => f.status !== 'demitido');

  const { data: registros } = await supabaseClient.from('funcionario_dias_trabalhados').select('*').eq('data', data);
  const mapa = new Map((registros || []).map(r => [r.funcionario_id, r]));

  document.getElementById('listaDiaDias').innerHTML = ativos.length === 0
    ? '<p style="color:var(--text-dim);font-size:13px">Nenhum funcionário ativo cadastrado.</p>'
    : ativos.map(f => {
      const registro = mapa.get(f.id);
      const status = registro ? registro.status : '';
      const cor = STATUS_CORES[status];
      const estilo = cor ? `style="background:${cor.bg};color:${cor.fg}"` : '';
      return `
        <div class="dia-item">
          <div style="flex:1;font-weight:500">${f.nome}${f.cargo ? `<span style="color:var(--text-dim);font-weight:400"> — ${f.cargo}</span>` : ''}</div>
          <select ${estilo} style="min-width:170px" onchange="salvarDiaTrabalhadoLista(${f.id}, '${data}', this.value)">
            <option value="">—</option>
            ${STATUS_OPCOES.map(s => `<option value="${s}" ${status === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
          <input type="text" placeholder="Observação" value="${(registro && registro.observacao ? registro.observacao : '').replace(/"/g, '&quot;')}"
                 style="flex:1;max-width:260px;margin-left:8px"
                 onblur="salvarObsDiaLista(${f.id}, '${data}', this.value)">
        </div>
      `;
    }).join('');
}

async function salvarDiaTrabalhadoLista(funcionarioId, data, status) {
  await salvarDiaTrabalhado(funcionarioId, data, status, false);
  carregarListaDia();
}

async function salvarObsDiaLista(funcionarioId, data, observacao) {
  const { data: existente } = await supabaseClient.from('funcionario_dias_trabalhados').select('*').eq('funcionario_id', funcionarioId).eq('data', data).maybeSingle();
  if (!existente && !observacao) return;
  await supabaseClient.from('funcionario_dias_trabalhados').upsert(
    { funcionario_id: funcionarioId, data, status: existente ? existente.status : 'Trabalhou', observacao: observacao || null },
    { onConflict: 'funcionario_id,data' }
  );
}

let gradeMesCarregada = false;
async function alternarGradeMes() {
  const bloco = document.getElementById('blocoGradeMes');
  const icone = document.getElementById('iconeExpandirMes');
  const abrindo = bloco.style.display === 'none';
  bloco.style.display = abrindo ? '' : 'none';
  icone.className = abrindo ? 'ti ti-chevron-up' : 'ti ti-chevron-down';
  if (abrindo && !gradeMesCarregada) {
    gradeMesCarregada = true;
    await carregarGridDias();
  }
}

// ---------- Dias trabalhados (grade do mês) ----------
document.getElementById('filtroMesDias').addEventListener('change', carregarGridDias);

async function carregarGridDias() {
  const mes = document.getElementById('filtroMesDias').value;
  const [ano, mesNum] = mes.split('-').map(Number);
  const ultimoDia = new Date(ano, mesNum, 0).getDate();

  const ativos = FUNCIONARIOS.filter(f => f.status !== 'demitido');

  const registros = await buscarPaginado(() => supabaseClient.from('funcionario_dias_trabalhados').select('*').gte('data', `${mes}-01`).lte('data', `${mes}-${String(ultimoDia).padStart(2, '0')}`));
  const mapaRegistros = new Map(registros.map(r => [`${r.funcionario_id}_${r.data}`, r]));

  const diasSemana = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

  let html = '<thead><tr><th>Data</th>' + ativos.map(f => `<th>${f.nome}</th>`).join('') + '</tr></thead><tbody>';
  for (let dia = 1; dia <= ultimoDia; dia++) {
    const dataISO = `${mes}-${String(dia).padStart(2, '0')}`;
    const diaSemanaIdx = new Date(ano, mesNum - 1, dia).getDay();
    const classeDia = diaSemanaIdx === 0 ? 'dia-domingo' : diaSemanaIdx === 6 ? 'dia-sabado' : '';
    html += `<tr class="${classeDia}"><td>${String(dia).padStart(2, '0')} ${diasSemana[diaSemanaIdx]}</td>`;
    ativos.forEach(f => {
      const chave = `${f.id}_${dataISO}`;
      const registro = mapaRegistros.get(chave);
      const status = registro ? registro.status : '';
      const temObs = registro && registro.observacao;
      const cor = STATUS_CORES[status];
      const estilo = cor ? `style="background:${cor.bg};color:${cor.fg}"` : '';
      html += `<td>
        <select ${estilo} onchange="salvarDiaTrabalhado(${f.id}, '${dataISO}', this.value)">
          <option value="">—</option>
          ${STATUS_OPCOES.map(s => `<option value="${s}" ${status === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <button class="obs-btn ${temObs ? 'tem-obs' : ''}" title="Observação" onclick="editarObsDia(${f.id}, '${dataISO}')"><i class="ti ti-message-2"></i></button>
      </td>`;
    });
    html += '</tr>';
  }
  html += '</tbody>';
  document.getElementById('tabelaGridDias').innerHTML = html;

  window._mapaRegistrosDias = mapaRegistros;
}

async function salvarDiaTrabalhado(funcionarioId, data, status, atualizarGrade = true) {
  if (!status) {
    await supabaseClient.from('funcionario_dias_trabalhados').delete().eq('funcionario_id', funcionarioId).eq('data', data);
  } else {
    await supabaseClient.from('funcionario_dias_trabalhados').upsert({ funcionario_id: funcionarioId, data, status }, { onConflict: 'funcionario_id,data' });
  }
  if (atualizarGrade) carregarGridDias();
}

async function editarObsDia(funcionarioId, data) {
  const registro = window._mapaRegistrosDias.get(`${funcionarioId}_${data}`);
  const atual = registro ? registro.observacao || '' : '';
  const nova = prompt('Observação:', atual);
  if (nova === null) return;
  if (!registro) {
    await supabaseClient.from('funcionario_dias_trabalhados').upsert({ funcionario_id: funcionarioId, data, status: 'Trabalhou', observacao: nova }, { onConflict: 'funcionario_id,data' });
  } else {
    await supabaseClient.from('funcionario_dias_trabalhados').update({ observacao: nova }).eq('funcionario_id', funcionarioId).eq('data', data);
  }
  carregarGridDias();
}

// ---------- Programação semanal (atividades programadas x realizadas) ----------
const DIAS_SEMANA_ABREV = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
let semanaSelecionada = 1;
let funcionarioSelecionadoAtividades = null;

document.getElementById('filtroMesAtividades').addEventListener('change', () => {
  semanaSelecionada = semanaDoDiaAtual();
  renderTabsSemanas();
  carregarSemanaAtividades();
  gradeMesAtividadesCarregada = false;
  document.getElementById('blocoGradeMesAtividades').style.display = 'none';
  document.getElementById('iconeExpandirMesAtividades').className = 'ti ti-chevron-down';
});

// Semanas sempre terminam no domingo (ou no último dia do mês, se o mês acabar antes)
function computarSemanasDoMes() {
  const mes = document.getElementById('filtroMesAtividades').value;
  const [ano, mesNum] = mes.split('-').map(Number);
  const ultimoDia = new Date(ano, mesNum, 0).getDate();
  const semanas = [];
  let diaInicio = 1;
  let numero = 1;
  while (diaInicio <= ultimoDia) {
    const diaSemanaInicio = new Date(ano, mesNum - 1, diaInicio).getDay(); // 0 = domingo
    const diasAteDomingo = diaSemanaInicio === 0 ? 0 : (7 - diaSemanaInicio);
    const diaFim = Math.min(diaInicio + diasAteDomingo, ultimoDia);
    semanas.push({ numero, diaInicio, diaFim });
    diaInicio = diaFim + 1;
    numero++;
  }
  return semanas;
}

function semanaDoDiaAtual() {
  const mes = document.getElementById('filtroMesAtividades').value;
  if (mes !== mesAtualISO()) return 1;
  const hoje = new Date().getDate();
  const semanas = computarSemanasDoMes();
  const encontrada = semanas.find(s => hoje >= s.diaInicio && hoje <= s.diaFim);
  return encontrada ? encontrada.numero : 1;
}

function renderTabsSemanas() {
  const semanas = computarSemanasDoMes();
  document.getElementById('tabsSemanas').innerHTML = semanas.map(s => `
    <button class="stbtn ${s.numero === semanaSelecionada ? 'active' : ''}" onclick="selecionarSemana(${s.numero})">Semana ${s.numero}</button>
  `).join('');
}

function selecionarSemana(numero) {
  semanaSelecionada = numero;
  renderTabsSemanas();
  carregarSemanaAtividades();
}

function renderBlocosFuncionariosAtividades() {
  const ativos = FUNCIONARIOS.filter(f => f.status !== 'demitido');
  if (!funcionarioSelecionadoAtividades && ativos.length > 0) funcionarioSelecionadoAtividades = ativos[0].id;

  document.getElementById('blocosFuncionariosAtividades').innerHTML = ativos.map(f => `
    <button class="bloco-funcionario ${f.id === funcionarioSelecionadoAtividades ? 'selecionado' : ''}" onclick="selecionarFuncionarioAtividades(${f.id})">${f.nome}</button>
  `).join('');

  const selecionado = ativos.find(f => f.id === funcionarioSelecionadoAtividades);
  document.getElementById('nomeFuncionarioSelecionado').textContent = selecionado ? selecionado.nome : 'Nenhum funcionário selecionado';
  document.getElementById('nomeFuncionarioSelecionadoMes').textContent = selecionado ? selecionado.nome : '—';
}

function selecionarFuncionarioAtividades(id) {
  funcionarioSelecionadoAtividades = id;
  renderBlocosFuncionariosAtividades();
  carregarSemanaAtividades();
  if (document.getElementById('blocoGradeMesAtividades').style.display !== 'none') carregarGridAtividades();
}

function linhaAtividadeHtml(dia, dataISO, ano, mesNum, funcionarioId, mapa) {
  const diaSemanaIdx = new Date(ano, mesNum - 1, dia).getDay();
  const classeDia = diaSemanaIdx === 0 ? 'dia-domingo' : diaSemanaIdx === 6 ? 'dia-sabado' : '';
  const registro = mapa.get(`${funcionarioId}_${dataISO}`);
  const prog = registro ? (registro.atividades_programadas || '') : '';
  const real = registro ? (registro.atividades_realizadas || '') : '';
  return `
    <div class="atividade-linha ${classeDia}">
      <div class="atividade-dia-label">${String(dia).padStart(2, '0')}<br>${DIAS_SEMANA_ABREV[diaSemanaIdx]}</div>
      <div class="atividade-campos">
        <div class="atividade-campo">
          <label>Programada</label>
          <input type="text" value="${prog.replace(/"/g, '&quot;')}" onblur="salvarAtividade(${funcionarioId}, '${dataISO}', 'atividades_programadas', this.value)">
        </div>
        <div class="atividade-campo">
          <label>Realizada</label>
          <input type="text" value="${real.replace(/"/g, '&quot;')}" onblur="salvarAtividade(${funcionarioId}, '${dataISO}', 'atividades_realizadas', this.value)">
        </div>
      </div>
    </div>`;
}

async function carregarSemanaAtividades() {
  renderBlocosFuncionariosAtividades();
  if (!funcionarioSelecionadoAtividades) {
    document.getElementById('listaSemanaAtividades').innerHTML = '<p style="color:var(--text-dim);font-size:13px">Cadastre um funcionário primeiro.</p>';
    return;
  }

  const mes = document.getElementById('filtroMesAtividades').value;
  const [ano, mesNum] = mes.split('-').map(Number);
  const semanas = computarSemanasDoMes();
  const semana = semanas.find(s => s.numero === semanaSelecionada) || semanas[0];

  const dataInicioISO = `${mes}-${String(semana.diaInicio).padStart(2, '0')}`;
  const dataFimISO = `${mes}-${String(semana.diaFim).padStart(2, '0')}`;

  const { data: registros } = await supabaseClient.from('funcionario_atividades').select('*').eq('funcionario_id', funcionarioSelecionadoAtividades).gte('data', dataInicioISO).lte('data', dataFimISO);
  const mapa = new Map((registros || []).map(r => [`${r.funcionario_id}_${r.data}`, r]));
  window._mapaAtividades = mapa;

  let html = '';
  for (let dia = semana.diaInicio; dia <= semana.diaFim; dia++) {
    const dataISO = `${mes}-${String(dia).padStart(2, '0')}`;
    html += linhaAtividadeHtml(dia, dataISO, ano, mesNum, funcionarioSelecionadoAtividades, mapa);
  }
  document.getElementById('listaSemanaAtividades').innerHTML = html;
}

let gradeMesAtividadesCarregada = false;
async function alternarGradeMesAtividades() {
  const bloco = document.getElementById('blocoGradeMesAtividades');
  const icone = document.getElementById('iconeExpandirMesAtividades');
  const abrindo = bloco.style.display === 'none';
  bloco.style.display = abrindo ? '' : 'none';
  icone.className = abrindo ? 'ti ti-chevron-up' : 'ti ti-chevron-down';
  if (abrindo && !gradeMesAtividadesCarregada) {
    gradeMesAtividadesCarregada = true;
    await carregarGridAtividades();
  }
}

async function carregarGridAtividades() {
  if (!funcionarioSelecionadoAtividades) {
    document.getElementById('listaGridAtividades').innerHTML = '<p style="color:var(--text-dim);font-size:13px">Cadastre um funcionário primeiro.</p>';
    return;
  }

  const mes = document.getElementById('filtroMesAtividades').value;
  const [ano, mesNum] = mes.split('-').map(Number);
  const ultimoDia = new Date(ano, mesNum, 0).getDate();

  const registros = await buscarPaginado(() => supabaseClient.from('funcionario_atividades').select('*').eq('funcionario_id', funcionarioSelecionadoAtividades).gte('data', `${mes}-01`).lte('data', `${mes}-${String(ultimoDia).padStart(2, '0')}`));
  const mapa = new Map(registros.map(r => [`${r.funcionario_id}_${r.data}`, r]));
  window._mapaAtividades = mapa;

  let html = '';
  for (let dia = 1; dia <= ultimoDia; dia++) {
    const dataISO = `${mes}-${String(dia).padStart(2, '0')}`;
    html += linhaAtividadeHtml(dia, dataISO, ano, mesNum, funcionarioSelecionadoAtividades, mapa);
  }
  document.getElementById('listaGridAtividades').innerHTML = html;
}

async function salvarAtividade(funcionarioId, data, campo, valor) {
  const registro = window._mapaAtividades.get(`${funcionarioId}_${data}`);
  if (!registro && !valor) return;
  const payload = {
    funcionario_id: funcionarioId,
    data,
    atividades_programadas: registro ? registro.atividades_programadas : null,
    atividades_realizadas: registro ? registro.atividades_realizadas : null,
  };
  payload[campo] = valor || null;
  await supabaseClient.from('funcionario_atividades').upsert(payload, { onConflict: 'funcionario_id,data' });
  window._mapaAtividades.set(`${funcionarioId}_${data}`, payload);
}

// ---------- Férias ----------
document.getElementById('btnAddFerias').addEventListener('click', async () => {
  const funcionario_id = Number(document.getElementById('fvFuncionario').value);
  const periodo_aquisitivo_inicio = document.getElementById('fvPeriodoInicio').value;
  const periodo_aquisitivo_fim = document.getElementById('fvPeriodoFim').value;
  if (!funcionario_id || !periodo_aquisitivo_inicio || !periodo_aquisitivo_fim) return;

  const gozoInicio = document.getElementById('fvGozoInicio').value || null;
  await supabaseClient.from('funcionario_ferias').insert({
    funcionario_id, periodo_aquisitivo_inicio, periodo_aquisitivo_fim,
    data_inicio_gozo: gozoInicio,
    data_fim_gozo: document.getElementById('fvGozoFim').value || null,
    dias: parseInt(document.getElementById('fvDias').value) || null,
    status: gozoInicio ? 'agendada' : 'pendente',
  });
  carregarFerias();
});

function renderSelectFuncionariosFerias() {
  document.getElementById('fvFuncionario').innerHTML = FUNCIONARIOS.filter(f => f.status !== 'demitido').map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
}

function nomeFuncionario(id) { return (FUNCIONARIOS.find(f => f.id === id) || {}).nome || '—'; }

async function carregarFerias() {
  renderSelectFuncionariosFerias();
  const { data } = await supabaseClient.from('funcionario_ferias').select('*').order('periodo_aquisitivo_inicio', { ascending: false });

  document.getElementById('tbodyFerias').innerHTML = (data || []).length === 0
    ? '<tr class="empty-row"><td colspan="6">Nenhuma férias registrada.</td></tr>'
    : data.map(f => `
      <tr>
        <td>${nomeFuncionario(f.funcionario_id)}</td>
        <td>${new Date(f.periodo_aquisitivo_inicio + 'T00:00:00').toLocaleDateString('pt-BR')} a ${new Date(f.periodo_aquisitivo_fim + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
        <td>${f.data_inicio_gozo ? new Date(f.data_inicio_gozo + 'T00:00:00').toLocaleDateString('pt-BR') + ' a ' + (f.data_fim_gozo ? new Date(f.data_fim_gozo + 'T00:00:00').toLocaleDateString('pt-BR') : '—') : '—'}</td>
        <td style="text-align:right">${f.dias ?? '—'}</td>
        <td><span class="badge ${f.status === 'gozada' ? 'bg-success' : f.status === 'agendada' ? 'bg-info' : 'bg-warning'}">${f.status}</span></td>
        <td style="white-space:nowrap">
          ${f.status !== 'gozada' ? `<button class="btn btn-success" style="padding:4px 10px" onclick="marcarFeriasGozada(${f.id})"><i class="ti ti-check"></i></button>` : ''}
          <button class="btn btn-danger" style="padding:4px 10px" onclick="excluirFerias(${f.id})"><i class="ti ti-trash"></i></button>
        </td>
      </tr>
    `).join('');
}

async function marcarFeriasGozada(id) {
  await supabaseClient.from('funcionario_ferias').update({ status: 'gozada' }).eq('id', id);
  carregarFerias();
}

async function excluirFerias(id) {
  await supabaseClient.from('funcionario_ferias').delete().eq('id', id);
  carregarFerias();
}

carregarBase();
