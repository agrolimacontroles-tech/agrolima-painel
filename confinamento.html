<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Lima Painel — Confinamento</title>
<link rel="icon" href="logo-agrolima.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<script src="supabase-config.js"></script>
<script src="layout.js"></script>
<script>
renderTopbarSidebar('confinamento');

document.getElementById('mainContent').innerHTML = `
  <div class="pagehead">
    <div>
      <div class="pagetitle">Confinamento</div>
      <div class="pagesub">Lotes, gado no cocho e volumoso (produção e estoque)</div>
    </div>
  </div>

  <div class="subtoggle">
    <button class="stbtn active" id="btnTabLotes" onclick="mostrarAba('lotes')">Lotes</button>
    <button class="stbtn" id="btnTabCocho" onclick="mostrarAba('cocho')">Gado no Cocho</button>
    <button class="stbtn" id="btnTabVolumoso" onclick="mostrarAba('volumoso')">Volumoso</button>
  </div>

  <div id="abaLotes">
    <div class="card">
      <div class="cardh"><i class="ti ti-plus"></i> Cadastrar lote</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Nome do lote</label><input type="text" id="lcNome" placeholder="Lote 01 / Curral A..."></div>
          <div class="fgroup full"><label>Observação</label><input type="text" id="lcObservacao"></div>
        </div>
        <button class="btn btn-primary" id="btnSalvarLoteCadastro"><i class="ti ti-check"></i> Cadastrar</button>
        <span id="msgLoteCadastro" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Lotes cadastrados</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Nome</th><th>Observação</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbodyLotesCadastro"><tr class="empty-row"><td colspan="4"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaCocho" style="display:none">
    <div class="metrics" id="metricasCocho"><div class="metric"><span class="spinner"></span></div></div>

    <div class="card">
      <div class="cardh"><i class="ti ti-plus"></i> Nova entrada de gado</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Lote</label><select id="eLote"></select></div>
          <div class="fgroup"><label>Data de entrada</label><input type="date" id="eDataEntrada"></div>
          <div class="fgroup"><label>Quantidade (cabeças)</label><input type="number" id="eQuantidade" step="1"></div>
          <div class="fgroup"><label>Peso médio de entrada (kg)</label><input type="number" id="ePesoMedio" step="0.1"></div>
          <div class="fgroup full"><label>Observação</label><input type="text" id="eObservacao"></div>
        </div>
        <button class="btn btn-primary" id="btnSalvarEntrada"><i class="ti ti-check"></i> Registrar entrada</button>
        <span id="msgEntrada" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Entradas em confinamento</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Lote</th><th>Entrada</th><th style="text-align:right">Cabeças entrada</th><th style="text-align:right">Peso médio entrada</th><th style="text-align:right">No cocho agora</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbodyEntradas"><tr class="empty-row"><td colspan="7"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Histórico de saídas</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Lote</th><th style="text-align:right">Quantidade</th><th style="text-align:right">Peso médio</th><th>Destino</th></tr></thead>
          <tbody id="tbodySaidas"><tr class="empty-row"><td colspan="5"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaVolumoso" style="display:none">
    <div class="card">
      <div class="cardh"><i class="ti ti-plus"></i> Cadastrar tipo de volumoso</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Nome</label><input type="text" id="vNome" placeholder="Silagem de milho"></div>
          <div class="fgroup"><label>Unidade</label><input type="text" id="vUnidade" value="kg"></div>
        </div>
        <button class="btn btn-primary" id="btnSalvarVolumoso"><i class="ti ti-check"></i> Cadastrar</button>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Estoque de volumoso</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Tipo</th><th style="text-align:right">Estoque atual</th></tr></thead>
          <tbody id="tbodyVolumosoEstoque"><tr class="empty-row"><td colspan="2"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh"><i class="ti ti-plus"></i> Lançar produção / consumo</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Tipo de volumoso</label><select id="mVolumoso"></select></div>
          <div class="fgroup"><label>Movimento</label>
            <select id="mTipoMov">
              <option value="producao">Produção (entrada)</option>
              <option value="consumo">Consumo (saída)</option>
              <option value="ajuste">Ajuste (novo saldo)</option>
            </select>
          </div>
          <div class="fgroup"><label>Quantidade</label><input type="number" id="mQuantidade" step="0.01"></div>
          <div class="fgroup"><label>Data</label><input type="date" id="mData"></div>
          <div class="fgroup full"><label>Observação</label><input type="text" id="mObservacao"></div>
        </div>
        <button class="btn btn-primary" id="btnSalvarMovVolumoso"><i class="ti ti-check"></i> Registrar</button>
        <span id="msgMovVolumoso" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Movimentos</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Tipo</th><th>Movimento</th><th style="text-align:right">Quantidade</th><th>Observação</th></tr></thead>
          <tbody id="tbodyMovimentosVolumoso"><tr class="empty-row"><td colspan="5"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
`;

let LOTES_CADASTRO = [], ENTRADAS = [], SAIDAS = [], VOLUMOSOS = [], MOVIMENTOS_VOLUMOSO = [];

function hojeISO() { return new Date().toISOString().slice(0, 10); }
function fmtData(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : '—'; }

function mostrarAba(aba) {
  ['lotes', 'cocho', 'volumoso'].forEach(a => {
    document.getElementById('aba' + a[0].toUpperCase() + a.slice(1)).style.display = a === aba ? '' : 'none';
    document.getElementById('btnTab' + a[0].toUpperCase() + a.slice(1)).classList.toggle('active', a === aba);
  });
}

async function carregarBase() {
  await checkAuth();
  showUserEmail();

  document.getElementById('eDataEntrada').value = hojeISO();
  document.getElementById('mData').value = hojeISO();

  const [lotesCadastro, entradas, saidas, volumosos, movimentos] = await Promise.all([
    supabaseClient.from('confinamento_lotes').select('*').order('nome').then(r => r.data || []),
    buscarPaginado(() => supabaseClient.from('confinamento_entradas').select('*').order('data_entrada', { ascending: false })),
    buscarPaginado(() => supabaseClient.from('confinamento_saidas').select('*').order('data', { ascending: false })),
    supabaseClient.from('confinamento_volumoso').select('*').eq('ativo', true).order('nome').then(r => r.data || []),
    buscarPaginado(() => supabaseClient.from('confinamento_volumoso_movimentos').select('*').order('data', { ascending: false })),
  ]);
  LOTES_CADASTRO = lotesCadastro; ENTRADAS = entradas; SAIDAS = saidas; VOLUMOSOS = volumosos; MOVIMENTOS_VOLUMOSO = movimentos;

  document.getElementById('eLote').innerHTML = LOTES_CADASTRO.filter(l => l.ativo).map(l => `<option value="${l.id}">${l.nome}</option>`).join('')
    || '<option value="">Cadastre um lote primeiro</option>';
  document.getElementById('mVolumoso').innerHTML = VOLUMOSOS.map(v => `<option value="${v.id}">${v.nome}</option>`).join('');

  renderLotesCadastro();
  renderCocho();
  renderVolumoso();

  const abaUrl = new URLSearchParams(location.search).get('aba');
  if (abaUrl) mostrarAba(abaUrl);
}

// ---------- Lotes (cadastro) ----------
document.getElementById('btnSalvarLoteCadastro').addEventListener('click', async () => {
  const nome = document.getElementById('lcNome').value.trim();
  const msg = document.getElementById('msgLoteCadastro');
  if (!nome) { msg.textContent = 'Informe o nome do lote.'; msg.className = 'msg show error'; return; }
  const { error } = await supabaseClient.from('confinamento_lotes').insert({
    nome, observacao: document.getElementById('lcObservacao').value.trim() || null,
  });
  if (error) { msg.textContent = 'Erro: ' + error.message; msg.className = 'msg show error'; return; }
  msg.textContent = 'Lote cadastrado!'; msg.className = 'msg show success';
  ['lcNome', 'lcObservacao'].forEach(id => document.getElementById(id).value = '');
  await carregarBase();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
});

async function editarLoteCadastro(id) {
  const lote = LOTES_CADASTRO.find(l => l.id === id);
  const novoNome = prompt('Nome do lote:', lote.nome);
  if (novoNome === null || !novoNome.trim()) return;
  const novaObs = prompt('Observação:', lote.observacao || '');
  await supabaseClient.from('confinamento_lotes').update({ nome: novoNome.trim(), observacao: (novaObs || '').trim() || null }).eq('id', id);
  await carregarBase();
}

async function alternarAtivoLote(id, ativo) {
  await supabaseClient.from('confinamento_lotes').update({ ativo }).eq('id', id);
  await carregarBase();
}

function renderLotesCadastro() {
  document.getElementById('tbodyLotesCadastro').innerHTML = LOTES_CADASTRO.length === 0
    ? '<tr class="empty-row"><td colspan="4">Nenhum lote cadastrado ainda.</td></tr>'
    : LOTES_CADASTRO.map(l => `
      <tr>
        <td><b>${l.nome}</b></td>
        <td>${l.observacao || '—'}</td>
        <td>${l.ativo ? '<span class="badge bg-success">Ativo</span>' : '<span class="badge bg-warning">Pausado</span>'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-secondary" style="padding:4px 10px" onclick="editarLoteCadastro(${l.id})"><i class="ti ti-pencil"></i></button>
          ${l.ativo
            ? `<button class="btn btn-secondary" style="padding:4px 10px" onclick="alternarAtivoLote(${l.id}, false)"><i class="ti ti-player-pause"></i></button>`
            : `<button class="btn btn-success" style="padding:4px 10px" onclick="alternarAtivoLote(${l.id}, true)"><i class="ti ti-player-play"></i></button>`}
        </td>
      </tr>
    `).join('');
}

// ---------- Gado no cocho ----------
function quantidadeSaidaDaEntrada(entradaId) {
  return SAIDAS.filter(s => s.entrada_id === entradaId).reduce((s, x) => s + x.quantidade, 0);
}
function nomeLoteDaEntrada(entradaId) {
  const e = ENTRADAS.find(x => x.id === entradaId);
  return e ? nomeLote(e.lote_id) : '—';
}
function nomeLote(loteId) { return (LOTES_CADASTRO.find(l => l.id === loteId) || {}).nome || '—'; }

document.getElementById('btnSalvarEntrada').addEventListener('click', async () => {
  const lote_id = Number(document.getElementById('eLote').value);
  const quantidade_entrada = parseInt(document.getElementById('eQuantidade').value);
  const msg = document.getElementById('msgEntrada');
  if (!lote_id || !quantidade_entrada) {
    msg.textContent = 'Escolha o lote e informe a quantidade.';
    msg.className = 'msg show error';
    return;
  }
  const { error } = await supabaseClient.from('confinamento_entradas').insert({
    lote_id,
    data_entrada: document.getElementById('eDataEntrada').value,
    quantidade_entrada,
    peso_medio_entrada_kg: parseFloat(document.getElementById('ePesoMedio').value) || null,
    observacao: document.getElementById('eObservacao').value.trim() || null,
  });
  if (error) { msg.textContent = 'Erro: ' + error.message; msg.className = 'msg show error'; return; }
  msg.textContent = 'Entrada registrada!'; msg.className = 'msg show success';
  ['eQuantidade', 'ePesoMedio', 'eObservacao'].forEach(id => document.getElementById(id).value = '');
  await carregarBase();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
});

async function registrarSaida(entradaId) {
  const restante = ENTRADAS.find(e => e.id === entradaId).quantidade_entrada - quantidadeSaidaDaEntrada(entradaId);
  const quantidade = parseInt(prompt(`Quantas cabeças saem agora? (restam ${restante})`, restante));
  if (!quantidade || quantidade <= 0) return;
  if (quantidade > restante) { alert(`Essa entrada só tem ${restante} cabeças restantes.`); return; }
  const pesoMedio = parseFloat(prompt('Peso médio de saída (kg), opcional:') || '');
  const destino = prompt('Destino (venda, frigorífico, transferência...):') || null;
  await supabaseClient.from('confinamento_saidas').insert({
    entrada_id: entradaId, data: hojeISO(), quantidade, peso_medio_kg: isNaN(pesoMedio) ? null : pesoMedio, destino,
  });
  await carregarBase();
}

function renderCocho() {
  const totalEntrada = ENTRADAS.reduce((s, e) => s + e.quantidade_entrada, 0);
  const totalSaida = SAIDAS.reduce((s, x) => s + x.quantidade, 0);
  const noCochoAgora = totalEntrada - totalSaida;
  const entradasAtivas = ENTRADAS.filter(e => (e.quantidade_entrada - quantidadeSaidaDaEntrada(e.id)) > 0).length;

  document.getElementById('metricasCocho').innerHTML = `
    <div class="metric"><div class="micon bg-info"><i class="ti ti-tag"></i></div><div><div class="mlabel">Gado no cocho agora</div><div class="mval">${noCochoAgora}</div></div></div>
    <div class="metric"><div class="micon bg-info"><i class="ti ti-stack-2"></i></div><div><div class="mlabel">Entradas ativas</div><div class="mval">${entradasAtivas}</div></div></div>
    <div class="metric"><div class="micon bg-success"><i class="ti ti-login"></i></div><div><div class="mlabel">Total já entrou</div><div class="mval">${totalEntrada}</div></div></div>
    <div class="metric"><div class="micon bg-warning"><i class="ti ti-logout"></i></div><div><div class="mlabel">Total já saiu</div><div class="mval">${totalSaida}</div></div></div>
  `;

  document.getElementById('tbodyEntradas').innerHTML = ENTRADAS.length === 0
    ? '<tr class="empty-row"><td colspan="7">Nenhuma entrada registrada ainda.</td></tr>'
    : ENTRADAS.map(e => {
      const restante = e.quantidade_entrada - quantidadeSaidaDaEntrada(e.id);
      return `
        <tr>
          <td><b>${nomeLote(e.lote_id)}</b></td>
          <td>${fmtData(e.data_entrada)}</td>
          <td style="text-align:right">${e.quantidade_entrada}</td>
          <td style="text-align:right">${e.peso_medio_entrada_kg ? e.peso_medio_entrada_kg + ' kg' : '—'}</td>
          <td style="text-align:right;font-weight:600">${restante}</td>
          <td>${restante > 0 ? '<span class="badge bg-info">Ativo</span>' : '<span class="badge bg-success">Encerrado</span>'}</td>
          <td>${restante > 0 ? `<button class="btn btn-secondary" style="padding:4px 10px" onclick="registrarSaida(${e.id})"><i class="ti ti-logout"></i> Saída</button>` : ''}</td>
        </tr>
      `;
    }).join('');

  document.getElementById('tbodySaidas').innerHTML = SAIDAS.length === 0
    ? '<tr class="empty-row"><td colspan="5">Nenhuma saída registrada ainda.</td></tr>'
    : SAIDAS.map(s => `
      <tr>
        <td>${fmtData(s.data)}</td>
        <td>${nomeLoteDaEntrada(s.entrada_id)}</td>
        <td style="text-align:right">${s.quantidade}</td>
        <td style="text-align:right">${s.peso_medio_kg ? s.peso_medio_kg + ' kg' : '—'}</td>
        <td>${s.destino || '—'}</td>
      </tr>
    `).join('');
}

// ---------- Volumoso ----------
document.getElementById('btnSalvarVolumoso').addEventListener('click', async () => {
  const nome = document.getElementById('vNome').value.trim();
  if (!nome) return;
  await supabaseClient.from('confinamento_volumoso').insert({ nome, unidade: document.getElementById('vUnidade').value.trim() || 'kg' });
  ['vNome'].forEach(id => document.getElementById(id).value = '');
  await carregarBase();
});

document.getElementById('btnSalvarMovVolumoso').addEventListener('click', async () => {
  const volumoso_id = Number(document.getElementById('mVolumoso').value);
  const quantidade = parseFloat(document.getElementById('mQuantidade').value);
  const msg = document.getElementById('msgMovVolumoso');
  if (!volumoso_id || isNaN(quantidade)) {
    msg.textContent = 'Escolha o tipo de volumoso e a quantidade.';
    msg.className = 'msg show error';
    return;
  }
  await supabaseClient.from('confinamento_volumoso_movimentos').insert({
    volumoso_id,
    data: document.getElementById('mData').value,
    tipo: document.getElementById('mTipoMov').value,
    quantidade,
    observacao: document.getElementById('mObservacao').value.trim() || null,
  });
  msg.textContent = 'Movimento registrado!'; msg.className = 'msg show success';
  ['mQuantidade', 'mObservacao'].forEach(id => document.getElementById(id).value = '');
  await carregarBase();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
});

function renderVolumoso() {
  document.getElementById('tbodyVolumosoEstoque').innerHTML = VOLUMOSOS.length === 0
    ? '<tr class="empty-row"><td colspan="2">Nenhum tipo de volumoso cadastrado.</td></tr>'
    : VOLUMOSOS.map(v => `<tr><td>${v.nome}</td><td style="text-align:right">${Number(v.estoque_atual).toLocaleString('pt-BR')} ${v.unidade}</td></tr>`).join('');

  const labelMov = { producao: '<span class="badge bg-success">Produção</span>', consumo: '<span class="badge bg-danger">Consumo</span>', ajuste: '<span class="badge bg-info">Ajuste</span>' };
  document.getElementById('tbodyMovimentosVolumoso').innerHTML = MOVIMENTOS_VOLUMOSO.length === 0
    ? '<tr class="empty-row"><td colspan="5">Nenhum movimento registrado ainda.</td></tr>'
    : MOVIMENTOS_VOLUMOSO.map(m => `
      <tr>
        <td>${fmtData(m.data)}</td>
        <td>${(VOLUMOSOS.find(v => v.id === m.volumoso_id) || {}).nome || '—'}</td>
        <td>${labelMov[m.tipo] || m.tipo}</td>
        <td style="text-align:right">${m.quantidade}</td>
        <td>${m.observacao || '—'}</td>
      </tr>
    `).join('');
}

carregarBase();
</script>

</body>
</html>
