<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Lima Painel — Terras</title>
<link rel="icon" href="logo-agrolima.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<script src="supabase-config.js"></script>
<script src="layout.js"></script>
<script>
renderTopbarSidebar('terras');

document.getElementById('mainContent').innerHTML = `
  <div class="pagehead">
    <div>
      <div class="pagetitle">Terras</div>
      <div class="pagesub" id="totalFazendas">Cadastro de fazendas</div>
    </div>
  </div>

  <div class="subtoggle">
    <button class="stbtn active" id="btnTabLista" onclick="mostrarAba('lista')">Lista de fazendas</button>
    <button class="stbtn" id="btnTabCadastro" onclick="mostrarAba('cadastro')">Cadastrar fazenda</button>
    <button class="stbtn" id="btnTabOcupacao" onclick="mostrarAba('ocupacao')">Ocupação</button>
    <button class="stbtn" id="btnTabFaturamento" onclick="mostrarAba('faturamento')">Faturamento por Pasto</button>
  </div>

  <div id="abaLista">
    <div class="card">
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Fazenda</th><th>Proprietário</th><th>Município/UF</th><th>Atividade</th><th style="text-align:right">Capacidade</th><th style="text-align:right">Área total</th><th style="text-align:right">Área produtiva</th><th></th></tr></thead>
          <tbody id="tbodyFazendas"><tr class="empty-row"><td colspan="8"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaCadastro" style="display:none">
    <div id="msgFazenda" class="msg"></div>
    <div class="card">
      <div class="cardh"><i class="ti ti-map-2"></i> Identificação</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Nome da fazenda *</label><input type="text" id="fNome" placeholder="Fazenda São João"></div>
          <div class="fgroup"><label>Proprietário</label><input type="text" id="fProprietario"></div>
          <div class="fgroup">
            <label>Atividade exercida</label>
            <select id="fAtividade">
              <option value="">Selecione...</option>
              <option>Engorda</option>
              <option>Cria</option>
              <option>Recria</option>
              <option>Cria e recria</option>
              <option>Confinamento</option>
              <option>Misto</option>
              <option>Agricultura</option>
              <option>Arrendada</option>
            </select>
          </div>
          <div class="fgroup"><label>Capacidade (animais)</label><input type="number" id="fCapacidade" step="1"></div>
          <div class="fgroup"><label>Área total (ha)</label><input type="number" id="fAreaTotal" step="0.01"></div>
          <div class="fgroup"><label>Área produtiva (ha)</label><input type="number" id="fAreaProdutiva" step="0.01"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardh"><i class="ti ti-map-pin"></i> Localização</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Município</label><input type="text" id="fMunicipio"></div>
          <div class="fgroup"><label>Estado</label><input type="text" id="fEstado" maxlength="2" style="text-transform:uppercase"></div>
          <div class="fgroup full"><label>Observação</label><input type="text" id="fObservacao"></div>
        </div>
        <button class="btn btn-primary" id="btnSalvarFazenda"><i class="ti ti-check"></i> Cadastrar fazenda</button>
        <button class="btn btn-secondary" id="btnLimparFazenda">Limpar</button>
      </div>
    </div>
  </div>

  <div id="abaOcupacao" style="display:none">
    <div class="card">
      <div class="cardh"><i class="ti ti-chart-pie"></i> Ocupação por fazenda</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Fazenda</th><th style="text-align:right">Capacidade</th><th style="text-align:right">Ocupação atual</th><th style="text-align:right">% ocupado</th></tr></thead>
          <tbody id="tbodyOcupacaoResumo"><tr class="empty-row"><td colspan="4"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh"><i class="ti ti-plus"></i> Nova ocupação</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Fazenda</label><select id="oFazenda"></select></div>
          <div class="fgroup"><label>Ocupante</label><input type="text" id="oOcupante" placeholder="Top Boi, Confinamento..."></div>
          <div class="fgroup"><label>Quantidade de cabeças</label><input type="number" id="oQuantidade" step="1"></div>
          <div class="fgroup"><label>Data de início</label><input type="date" id="oDataInicio"></div>
          <div class="fgroup"><label>Valor mensal (pasto)</label><input type="number" id="oValorMensal" step="0.01"></div>
          <div class="fgroup full"><label>Observação</label><input type="text" id="oObservacao"></div>
        </div>
        <button class="btn btn-primary" id="btnSalvarOcupacao"><i class="ti ti-check"></i> Registrar ocupação</button>
        <span id="msgOcupacao" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Ocupações</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Fazenda</th><th>Ocupante</th><th style="text-align:right">Cabeças</th><th>Início</th><th>Fim</th><th style="text-align:right">Valor mensal</th><th></th></tr></thead>
          <tbody id="tbodyOcupacoes"><tr class="empty-row"><td colspan="7"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="abaFaturamento" style="display:none">
    <div class="metrics" id="metricasFaturamento"><div class="metric"><span class="spinner"></span></div></div>

    <div class="card">
      <div class="cardh"><i class="ti ti-plus"></i> Novo faturamento de pasto</div>
      <div class="cardb">
        <div class="frow cols-3">
          <div class="fgroup"><label>Fazenda</label><select id="pFazenda" onchange="atualizarOpcoesOcupacao()"></select></div>
          <div class="fgroup"><label>Ocupação (opcional)</label><select id="pOcupacao"><option value="">—</option></select></div>
          <div class="fgroup"><label>Data</label><input type="date" id="pData"></div>
          <div class="fgroup"><label>Valor</label><input type="number" id="pValor" step="0.01"></div>
          <div class="fgroup full"><label>Observação</label><input type="text" id="pObservacao"></div>
        </div>
        <button class="btn btn-primary" id="btnSalvarFaturamento"><i class="ti ti-check"></i> Registrar (gera lançamento de receita)</button>
        <span id="msgFaturamento" class="msg" style="display:inline-block;margin-left:10px"></span>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Faturamento por fazenda</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Fazenda</th><th style="text-align:right">Total faturado</th></tr></thead>
          <tbody id="tbodyFaturamentoPorFazenda"><tr class="empty-row"><td colspan="2"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="cardh">Histórico</div>
      <div class="cardb table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Fazenda</th><th>Ocupante</th><th style="text-align:right">Valor</th><th>Observação</th></tr></thead>
          <tbody id="tbodyFaturamentos"><tr class="empty-row"><td colspan="5"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
`;

let fazendaEditandoId = null;
let OCUPACOES = [], FATURAMENTOS = [], CONTA_PASTO_ID = null;

function hojeISO() { return new Date().toISOString().slice(0, 10); }

function mostrarAba(aba) {
  ['lista', 'cadastro', 'ocupacao', 'faturamento'].forEach(a => {
    document.getElementById('aba' + a[0].toUpperCase() + a.slice(1)).style.display = a === aba ? '' : 'none';
    document.getElementById('btnTab' + a[0].toUpperCase() + a.slice(1)).classList.toggle('active', a === aba);
  });
  if (aba === 'lista') carregarFazendas();
  if (aba === 'ocupacao') carregarOcupacoes();
  if (aba === 'faturamento') carregarFaturamentos();
}

function limparFormulario() {
  fazendaEditandoId = null;
  ['fNome', 'fProprietario', 'fAtividade', 'fCapacidade', 'fAreaTotal', 'fAreaProdutiva', 'fMunicipio', 'fEstado', 'fObservacao'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('btnSalvarFazenda').innerHTML = '<i class="ti ti-check"></i> Cadastrar fazenda';
}
document.getElementById('btnLimparFazenda').addEventListener('click', limparFormulario);

async function carregarFazendas() {
  const { data: fazendas, error } = await supabaseClient.from('terras_fazendas').select('*').order('nome');
  if (error) {
    document.getElementById('tbodyFazendas').innerHTML = `<tr class="empty-row"><td colspan="8">Erro ao carregar: ${error.message}</td></tr>`;
    return;
  }
  window._fazendas = fazendas || [];
  document.getElementById('totalFazendas').textContent = `${fazendas.length} fazenda${fazendas.length === 1 ? '' : 's'} cadastrada${fazendas.length === 1 ? '' : 's'}`;

  const opcoesFazenda = fazendas.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
  document.getElementById('oFazenda').innerHTML = opcoesFazenda || '<option value="">Cadastre uma fazenda primeiro</option>';
  document.getElementById('pFazenda').innerHTML = opcoesFazenda || '<option value="">Cadastre uma fazenda primeiro</option>';

  document.getElementById('tbodyFazendas').innerHTML = fazendas.length === 0
    ? '<tr class="empty-row"><td colspan="8">Nenhuma fazenda cadastrada ainda.</td></tr>'
    : fazendas.map(f => `
      <tr>
        <td><b>${f.nome}</b></td>
        <td>${f.proprietario || '—'}</td>
        <td>${f.municipio ? f.municipio + (f.estado ? '/' + f.estado : '') : '—'}</td>
        <td>${f.atividade ? `<span class="badge bg-info">${f.atividade}</span>` : '—'}</td>
        <td style="text-align:right">${f.capacidade ?? '—'}</td>
        <td style="text-align:right">${f.area_total_ha ? Number(f.area_total_ha).toLocaleString('pt-BR') + ' ha' : '—'}</td>
        <td style="text-align:right">${f.area_produtiva_ha ? Number(f.area_produtiva_ha).toLocaleString('pt-BR') + ' ha' : '—'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-secondary" style="padding:4px 10px" onclick="editarFazenda(${f.id})"><i class="ti ti-pencil"></i></button>
          <button class="btn btn-danger" style="padding:4px 10px" onclick="excluirFazenda(${f.id}, '${f.nome.replace(/'/g, "\\'")}')"><i class="ti ti-trash"></i></button>
        </td>
      </tr>
    `).join('');
}

function editarFazenda(id) {
  const f = (window._fazendas || []).find(x => x.id === id);
  if (!f) return;
  fazendaEditandoId = id;
  document.getElementById('fNome').value = f.nome || '';
  document.getElementById('fProprietario').value = f.proprietario || '';
  document.getElementById('fAtividade').value = f.atividade || '';
  document.getElementById('fCapacidade').value = f.capacidade ?? '';
  document.getElementById('fAreaTotal').value = f.area_total_ha ?? '';
  document.getElementById('fAreaProdutiva').value = f.area_produtiva_ha ?? '';
  document.getElementById('fMunicipio').value = f.municipio || '';
  document.getElementById('fEstado').value = f.estado || '';
  document.getElementById('fObservacao').value = f.observacao || '';
  document.getElementById('btnSalvarFazenda').innerHTML = '<i class="ti ti-check"></i> Salvar alterações';
  mostrarAba('cadastro');
}

async function excluirFazenda(id, nome) {
  if (!confirm(`Excluir a fazenda "${nome}"? Essa ação não pode ser desfeita.`)) return;
  await supabaseClient.from('terras_fazendas').delete().eq('id', id);
  carregarFazendas();
}

async function salvarFazenda() {
  const nome = document.getElementById('fNome').value.trim();
  const msg = document.getElementById('msgFazenda');
  if (!nome) {
    msg.textContent = 'O nome da fazenda é obrigatório.';
    msg.className = 'msg show error';
    return;
  }

  const payload = {
    nome,
    proprietario: document.getElementById('fProprietario').value.trim() || null,
    atividade: document.getElementById('fAtividade').value || null,
    capacidade: document.getElementById('fCapacidade').value ? Number(document.getElementById('fCapacidade').value) : null,
    area_total_ha: document.getElementById('fAreaTotal').value ? Number(document.getElementById('fAreaTotal').value) : null,
    area_produtiva_ha: document.getElementById('fAreaProdutiva').value ? Number(document.getElementById('fAreaProdutiva').value) : null,
    municipio: document.getElementById('fMunicipio').value.trim() || null,
    estado: document.getElementById('fEstado').value.trim().toUpperCase() || null,
    observacao: document.getElementById('fObservacao').value.trim() || null,
  };

  let error;
  if (fazendaEditandoId) {
    ({ error } = await supabaseClient.from('terras_fazendas').update(payload).eq('id', fazendaEditandoId));
  } else {
    ({ error } = await supabaseClient.from('terras_fazendas').insert(payload));
  }

  if (error) {
    msg.textContent = 'Erro ao salvar: ' + error.message;
    msg.className = 'msg show error';
    return;
  }

  msg.textContent = fazendaEditandoId ? 'Fazenda atualizada!' : 'Fazenda cadastrada!';
  msg.className = 'msg show success';
  limparFormulario();
  mostrarAba('lista');
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
}
document.getElementById('btnSalvarFazenda').addEventListener('click', salvarFazenda);

// ---------- Ocupação das fazendas ----------
function nomeFazenda(id) { return (window._fazendas || []).find(f => f.id === id)?.nome || '—'; }

document.getElementById('oDataInicio').value = hojeISO();

document.getElementById('btnSalvarOcupacao').addEventListener('click', async () => {
  const fazenda_id = Number(document.getElementById('oFazenda').value);
  const ocupante = document.getElementById('oOcupante').value.trim();
  const quantidade_cabecas = parseInt(document.getElementById('oQuantidade').value);
  const msg = document.getElementById('msgOcupacao');
  if (!fazenda_id || !ocupante || !quantidade_cabecas) {
    msg.textContent = 'Preencha fazenda, ocupante e quantidade de cabeças.';
    msg.className = 'msg show error';
    return;
  }
  const { error } = await supabaseClient.from('terras_ocupacoes').insert({
    fazenda_id, ocupante, quantidade_cabecas,
    data_inicio: document.getElementById('oDataInicio').value,
    valor_mensal: parseFloat(document.getElementById('oValorMensal').value) || null,
    observacao: document.getElementById('oObservacao').value.trim() || null,
  });
  if (error) { msg.textContent = 'Erro: ' + error.message; msg.className = 'msg show error'; return; }
  msg.textContent = 'Ocupação registrada!'; msg.className = 'msg show success';
  ['oOcupante', 'oQuantidade', 'oValorMensal', 'oObservacao'].forEach(id => document.getElementById(id).value = '');
  await carregarOcupacoes();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 3000);
});

async function encerrarOcupacao(id) {
  if (!confirm('Encerrar essa ocupação hoje?')) return;
  await supabaseClient.from('terras_ocupacoes').update({ data_fim: hojeISO() }).eq('id', id);
  await carregarOcupacoes();
}

async function carregarOcupacoes() {
  const { data } = await supabaseClient.from('terras_ocupacoes').select('*').order('data_inicio', { ascending: false });
  OCUPACOES = data || [];

  const hoje = hojeISO();
  const resumo = (window._fazendas || []).map(f => {
    const ativas = OCUPACOES.filter(o => o.fazenda_id === f.id && (!o.data_fim || o.data_fim >= hoje));
    const ocupacaoAtual = ativas.reduce((s, o) => s + o.quantidade_cabecas, 0);
    const pct = f.capacidade ? (ocupacaoAtual / f.capacidade * 100) : null;
    return { fazenda: f, ocupacaoAtual, pct };
  });

  document.getElementById('tbodyOcupacaoResumo').innerHTML = resumo.length === 0
    ? '<tr class="empty-row"><td colspan="4">Nenhuma fazenda cadastrada ainda.</td></tr>'
    : resumo.map(r => `
      <tr>
        <td><b>${r.fazenda.nome}</b></td>
        <td style="text-align:right">${r.fazenda.capacidade ?? '—'}</td>
        <td style="text-align:right">${r.ocupacaoAtual}</td>
        <td style="text-align:right;color:${r.pct !== null && r.pct >= 100 ? 'var(--danger)' : r.pct !== null && r.pct >= 80 ? 'var(--warning)' : 'var(--text)'}">${r.pct !== null ? r.pct.toFixed(0) + '%' : '—'}</td>
      </tr>
    `).join('');

  document.getElementById('tbodyOcupacoes').innerHTML = OCUPACOES.length === 0
    ? '<tr class="empty-row"><td colspan="7">Nenhuma ocupação registrada ainda.</td></tr>'
    : OCUPACOES.map(o => `
      <tr>
        <td>${nomeFazenda(o.fazenda_id)}</td>
        <td>${o.ocupante}</td>
        <td style="text-align:right">${o.quantidade_cabecas}</td>
        <td>${new Date(o.data_inicio + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
        <td>${o.data_fim ? new Date(o.data_fim + 'T00:00:00').toLocaleDateString('pt-BR') : '<span class="badge bg-success">Ativa</span>'}</td>
        <td style="text-align:right">${o.valor_mensal ? formatarMoeda(o.valor_mensal) : '—'}</td>
        <td>${!o.data_fim ? `<button class="btn btn-secondary" style="padding:4px 10px" onclick="encerrarOcupacao(${o.id})"><i class="ti ti-logout"></i> Encerrar</button>` : ''}</td>
      </tr>
    `).join('');
}

// ---------- Faturamento por pasto ----------
document.getElementById('pData').value = hojeISO();

function atualizarOpcoesOcupacao() {
  const fazendaId = Number(document.getElementById('pFazenda').value);
  const ocupacoesDaFazenda = OCUPACOES.filter(o => o.fazenda_id === fazendaId);
  document.getElementById('pOcupacao').innerHTML = '<option value="">—</option>' +
    ocupacoesDaFazenda.map(o => `<option value="${o.id}">${o.ocupante} (${o.quantidade_cabecas} cab.)</option>`).join('');
}

document.getElementById('btnSalvarFaturamento').addEventListener('click', async () => {
  const fazenda_id = Number(document.getElementById('pFazenda').value);
  const ocupacao_id = Number(document.getElementById('pOcupacao').value) || null;
  const data = document.getElementById('pData').value;
  const valor = parseFloat(document.getElementById('pValor').value);
  const msg = document.getElementById('msgFaturamento');
  if (!fazenda_id || !data || isNaN(valor)) {
    msg.textContent = 'Preencha fazenda, data e valor.';
    msg.className = 'msg show error';
    return;
  }
  if (!CONTA_PASTO_ID) {
    msg.textContent = 'Conta "pasto" não encontrada no plano de contas de Terras.';
    msg.className = 'msg show error';
    return;
  }

  const ocupacao = ocupacao_id ? OCUPACOES.find(o => o.id === ocupacao_id) : null;
  const observacao = document.getElementById('pObservacao').value.trim() || null;

  const { data: lancamento, error: errLanc } = await supabaseClient.from('lancamentos').insert({
    empresa_id: 1, conta_id: CONTA_PASTO_ID, data, valor_total: valor,
    historico: `Pasto — ${nomeFazenda(fazenda_id)}${ocupacao ? ' — ' + ocupacao.ocupante : ''}`,
    fornecedor_comprador: ocupacao ? ocupacao.ocupante : null,
    observacao,
  }).select().single();

  if (errLanc) { msg.textContent = 'Erro ao gerar lançamento: ' + errLanc.message; msg.className = 'msg show error'; return; }

  const { error } = await supabaseClient.from('terras_faturamentos_pasto').insert({
    fazenda_id, ocupacao_id, data, valor, observacao, lancamento_id: lancamento.id,
  });
  if (error) { msg.textContent = 'Erro: ' + error.message; msg.className = 'msg show error'; return; }

  msg.textContent = 'Faturamento registrado e lançado no Fluxo de Caixa!'; msg.className = 'msg show success';
  ['pValor', 'pObservacao'].forEach(id => document.getElementById(id).value = '');
  await carregarFaturamentos();
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 4000);
});

async function carregarFaturamentos() {
  if (CONTA_PASTO_ID === null) {
    const { data } = await supabaseClient.from('contas').select('id').eq('empresa_id', 1).eq('tipo', 'receita').eq('nome', 'pasto').maybeSingle();
    CONTA_PASTO_ID = data ? data.id : undefined;
  }
  if (OCUPACOES.length === 0) await carregarOcupacoes();

  const { data } = await supabaseClient.from('terras_faturamentos_pasto').select('*').order('data', { ascending: false });
  FATURAMENTOS = data || [];

  const totalGeral = FATURAMENTOS.reduce((s, f) => s + Number(f.valor), 0);
  const esteAno = FATURAMENTOS.filter(f => f.data.slice(0, 4) === new Date().getFullYear().toString()).reduce((s, f) => s + Number(f.valor), 0);
  document.getElementById('metricasFaturamento').innerHTML = `
    <div class="metric"><div class="micon bg-success"><i class="ti ti-cash"></i></div><div><div class="mlabel">Total faturado (histórico)</div><div class="mval">${formatarMoeda(totalGeral)}</div></div></div>
    <div class="metric"><div class="micon bg-info"><i class="ti ti-calendar"></i></div><div><div class="mlabel">Faturado em ${new Date().getFullYear()}</div><div class="mval">${formatarMoeda(esteAno)}</div></div></div>
  `;

  const porFazenda = new Map();
  (window._fazendas || []).forEach(f => porFazenda.set(f.id, 0));
  FATURAMENTOS.forEach(f => porFazenda.set(f.fazenda_id, (porFazenda.get(f.fazenda_id) || 0) + Number(f.valor)));
  document.getElementById('tbodyFaturamentoPorFazenda').innerHTML = porFazenda.size === 0
    ? '<tr class="empty-row"><td colspan="2">Nenhuma fazenda cadastrada ainda.</td></tr>'
    : [...porFazenda.entries()].map(([id, total]) => `<tr><td>${nomeFazenda(id)}</td><td style="text-align:right">${formatarMoeda(total)}</td></tr>`).join('');

  document.getElementById('tbodyFaturamentos').innerHTML = FATURAMENTOS.length === 0
    ? '<tr class="empty-row"><td colspan="5">Nenhum faturamento registrado ainda.</td></tr>'
    : FATURAMENTOS.map(f => {
      const ocupacao = f.ocupacao_id ? OCUPACOES.find(o => o.id === f.ocupacao_id) : null;
      return `
        <tr>
          <td>${new Date(f.data + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
          <td>${nomeFazenda(f.fazenda_id)}</td>
          <td>${ocupacao ? ocupacao.ocupante : '—'}</td>
          <td style="text-align:right">${formatarMoeda(f.valor)}</td>
          <td>${f.observacao || '—'}</td>
        </tr>
      `;
    }).join('');
}

(async function init() {
  await checkAuth();
  showUserEmail();
  await carregarFazendas();
})();
</script>
